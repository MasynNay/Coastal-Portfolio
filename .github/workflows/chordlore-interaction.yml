name: Chordlore songwriting workbench browser QA
on:
  push:
    branches: [main]
    paths:
      - 'public/chordlore/index.html'
      - 'public/chordlore/mark.svg'
      - 'public/images/projects/chordlore.svg'
      - '.github/workflows/chordlore-interaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate melody interactions and mobile layout
        run: |
          python - <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          srv=ThreadingHTTPServer(("127.0.0.1",0),partial(Quiet,directory=str(Path("public").resolve())))
          Thread(target=srv.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  page=browser.new_page(viewport={"width":1440,"height":900},reduced_motion="reduce")
                  errs=[]
                  page.on("pageerror",lambda e:errs.append(str(e)))
                  response=page.goto(f"http://127.0.0.1:{srv.server_port}/chordlore/",wait_until="domcontentloaded")
                  assert response.status==200
                  assert page.title()=="Chordlore | Free Online Songwriting & Music Sketch Studio"
                  assert page.locator("#notes button").count()==12
                  assert page.locator('a[href="/chordlore/studio/"]').count()>=2
                  page.locator("#sketch-text").fill("A little moon over the river")
                  assert page.locator("#char-count").inner_text()=="28 / 140"
                  page.locator('button[data-mood="wistful"]').click()
                  assert page.locator('button[data-mood="wistful"]').get_attribute("aria-pressed")=="true"
                  page.locator("#play-sketch").click()
                  page.wait_for_timeout(500)
                  assert "Playing your twelve notes" in page.locator("#status").inner_text()
                  page.locator("#stop-sketch").click()
                  assert "Stopped" in page.locator("#status").inner_text()
                  page.set_viewport_size({"width":390,"height":844})
                  page.wait_for_timeout(100)
                  assert page.evaluate("document.documentElement.scrollWidth")<=391,"mobile horizontal overflow"
                  assert page.locator("#play-sketch").is_visible()
                  assert not errs,errs
                  browser.close()
                  print("Chordlore interactive workbench and mobile QA passed")
          finally:
              srv.shutdown()
          PY
