name: Build Windfall original understory (unreleased)

on:
  push:
    branches:
      - feature/windfall-2026-graphics-preview
    paths:
      - "public/windfall-2026/tools/build_understory.py"
      - ".github/workflows/windfall-understory-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forest-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free open-source original mesh authoring tools
        run: python -m pip install --disable-pip-version-check numpy Pillow trimesh
      - name: Build all three original GLB understory models
        working-directory: public/windfall-2026
        run: python tools/build_understory.py all
      - name: Inspect geometry counts, textures and asset budgets
        run: |
          python - <<'PY'
          import trimesh
          from pathlib import Path
          root=Path("public/windfall-2026/models")
          ids=["windfall-hazel-shrub","windfall-fern-understory","windfall-wildflower-patch"]
          expected={"windfall-hazel-shrub":2,"windfall-fern-understory":2,"windfall-wildflower-patch":3}
          for item in ids:
              path=root/(item+".glb")
              scene=trimesh.load(path,force="scene")
              assert len(scene.geometry)==expected[item],(item,len(scene.geometry))
              triangles=sum(len(mesh.faces) for mesh in scene.geometry.values())
              assert triangles>500 and path.stat().st_size<4*1024*1024
              assert scene.bounds[0,1]>-.2 and scene.bounds[1,1]<3.5
              for mesh in scene.geometry.values():
                  assert mesh.vertices.shape[0]>100
                  assert mesh.visual.kind=="texture"
              print(item,triangles,"triangles",path.stat().st_size,"bytes")
          PY
      - name: Commit original meshes on isolated preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/windfall-2026/models/windfall-hazel-shrub.glb
          git add public/windfall-2026/models/windfall-fern-understory.glb
          git add public/windfall-2026/models/windfall-wildflower-patch.glb
          if git diff --cached --quiet; then
            echo "All forest assets already current."
          else
            git commit -m "Stage original textured coastal undergrowth GLB models"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
