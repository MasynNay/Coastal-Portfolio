name: Chordlore Song Starter browser acceptance
on:
  push:
    branches: [main]
    paths:
      - 'public/chordlore/studio/**'
      - '.github/workflows/chordlore-song-starter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  song-starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Create, audition, save and reopen an original musical sketch
        run: |
          python - <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass

          srv=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(Path('public').resolve())))
          Thread(target=srv.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--autoplay-policy=no-user-gesture-required'])
                  page=browser.new_page(viewport={'width':1440,'height':900},reduced_motion='reduce')
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  response=page.goto(f'http://127.0.0.1:{srv.server_port}/chordlore/studio/#start',wait_until='domcontentloaded')
                  assert response.status==200
                  starter=page.locator('#starter-line')
                  starter.wait_for(state='visible')
                  lyric='The porch light is still on for you'
                  starter.fill(lyric)
                  page.locator('#starter-feel').select_option('pulse')
                  page.locator('[data-action="starter-create"]').click()
                  assert page.locator('#song-title').input_value()==lyric
                  assert page.locator('[data-action="starter-audition"]').is_visible()
                  assert page.locator('[data-action="export-wav"]').is_visible()
                  assert page.get_by_role('button',name='Back up song project').is_visible()
                  assert 'Your first musical direction' not in page.content() or page.locator('.song-starter-panel').count()==1
                  assert 'The porch light is still on for you' in page.content()
                  with page.expect_download(timeout=90000) as wav_event:
                      page.locator('[data-action="export-wav"]').click()
                  wav=wav_event.value
                  assert wav.suggested_filename.endswith('-mix.wav'),wav.suggested_filename
                  with open(wav.path(),'rb') as audio:
                      head=audio.read(12)
                  assert head[:4]==b'RIFF' and head[8:12]==b'WAVE','Downloaded file is not a WAV'
                  page.locator('[data-action="starter-audition"]').click()
                  page.wait_for_timeout(600)
                  assert page.locator('[data-action="starter-audition"]').is_visible()
                  page.reload(wait_until='domcontentloaded')
                  page.locator('[data-view="guide"]').first.click()
                  assert page.locator('#song-title').input_value()==lyric
                  assert page.locator('[data-action="starter-audition"]').is_visible()
                  page.set_viewport_size({'width':390,'height':844})
                  page.wait_for_timeout(100)
                  assert page.evaluate('document.documentElement.scrollWidth')<=391,'Song Starter horizontal mobile overflow'
                  assert not errors,errors
                  browser.close()
                  print('Public Chordlore Song Starter browser acceptance passed.')
          finally:
              srv.shutdown()
          PY
