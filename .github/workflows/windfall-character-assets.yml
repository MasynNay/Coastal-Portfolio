name: Build Windfall original character ensemble (unreleased)

on:
  push:
    branches:
      - feature/windfall-2026-graphics-preview
    paths:
      - "public/windfall-2026/tools/build_wayfarer.py"
      - ".github/workflows/windfall-character-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-characters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free local mesh authoring tools
        run: python -m pip install --disable-pip-version-check numpy Pillow trimesh
      - name: Build five original GLB rig variants
        working-directory: public/windfall-2026
        run: |
          for id in windfall-wayfarer windfall-companion-a windfall-companion-b windfall-companion-c windfall-companion-d; do
            echo "Generating $id"
            WINDFALL_CHARACTER="$id" python tools/build_wayfarer.py
          done
      - name: Inspect exported glTF rigs and distinct proportions
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh
          root=Path("public/windfall-2026/models")
          ids=["windfall-wayfarer","windfall-companion-a","windfall-companion-b","windfall-companion-c","windfall-companion-d"]
          heights=[]
          for id in ids:
              p=root/(id+".glb")
              s=trimesh.load(p,force="scene")
              tri=sum(len(m.faces) for m in s.geometry.values())
              assert tri>13000,(id,tri)
              assert all(x in s.graph.nodes for x in ("body","head","arm-L","arm-R","leg-L","leg-R","shin-L","shin-R","cape"))
              assert p.stat().st_size<8*1024*1024,p
              heights.append(float(s.bounds[1,1]-s.bounds[0,1]))
              print(id,p.stat().st_size,"bytes",tri,"tris",round(heights[-1],2),"height")
          assert heights[0]>heights[2]>heights[3]>heights[4],heights
          assert heights[0]>heights[1]>heights[2],heights
          PY
      - name: Commit original model artifacts only to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/windfall-2026/models/windfall-wayfarer.glb
          git add public/windfall-2026/models/windfall-companion-*.glb
          if git diff --cached --quiet; then
            echo "Original meshes already current."
          else
            git commit -m "Stage five original sculpted articulated Windfall character meshes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
