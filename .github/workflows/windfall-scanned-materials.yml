name: Build local CC0 Windfall scans (unreleased)

on:
  push:
    branches:
      - feature/windfall-2026-graphics-preview
    paths:
      - "public/windfall-2026/tools/build_scanned_materials.py"
      - ".github/workflows/windfall-scanned-materials.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scanned-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated graphics branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python for asset authoring
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download CC0 originals and generate self-hosted tiles
        run: python public/windfall-2026/tools/build_scanned_materials.py
      - name: Verify local provenance and material PNG files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("public/windfall-2026/materials")
          metadata=json.loads((root/"SOURCES.json").read_text())
          assert len(metadata["assets"]) == 3
          for item in metadata["assets"]:
              assert item["license"]=="CC0-1.0"
              file=root/item["local_file"]
              with Image.open(file) as image:
                  assert image.size == (384,384) and image.mode == "RGBA"
              print("Checked",file)
          PY
      - name: Commit generated scans only on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/windfall-2026/materials/
          if git diff --cached --quiet; then
            echo "Scans already current; nothing to commit."
          else
            git commit -m "Stage locally hosted CC0 village surface tiles and recorded provenance"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
