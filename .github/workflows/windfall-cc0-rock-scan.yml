name: Stage verified CC0 mossy rock scan (unreleased)

on:
  push:
    branches:
      - feature/windfall-2026-graphics-preview
    paths:
      - "public/windfall-2026/tools/import_cc0_rocks.py"
      - ".github/workflows/windfall-cc0-rock-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free photogrammetry import dependencies
        run: python -m pip install --disable-pip-version-check numpy Pillow trimesh
      - name: Verify CC0 sources and import locally packaged GLB
        working-directory: public/windfall-2026
        run: python tools/import_cc0_rocks.py
      - name: Check embedded model, bounded triangle count, credits and SHA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import trimesh
          root=Path("public/windfall-2026/models")
          m=json.loads((root/"windfall-cc0-mossy-rock-set.SOURCES.json").read_text())
          assert m["license"]=="CC0-1.0" and m["author"]=="Kless Gyzen"
          assert m["runtime_network"] is False and len(m["files"])>=2
          raw=(root/"windfall-cc0-mossy-rock-set.glb").read_bytes()
          assert raw[:4]==b"glTF"
          assert hashlib.sha256(raw).hexdigest()==m["runtime_sha256"]
          scene=trimesh.load(root/"windfall-cc0-mossy-rock-set.glb",force="scene")
          tri=sum(len(mesh.faces) for mesh in scene.geometry.values())
          assert tri==m["triangles"] and 1500<tri<250000
          assert len(raw)<24*1024*1024
          print("Verified offline CC0 scan",tri,"triangles",len(raw),"bytes")
          PY
      - name: Commit attributed scan to isolated preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/windfall-2026/models/windfall-cc0-mossy-rock-set.glb
          git add public/windfall-2026/models/windfall-cc0-mossy-rock-set.SOURCES.json
          if git diff --cached --quiet; then
            echo "Scanned rock set already current."
          else
            git commit -m "Stage attributed Poly Haven CC0 photogrammetric mossy rock set"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
