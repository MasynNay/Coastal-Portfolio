        p.mixExportedAt=Date.now();p.mixExportSignature=exportSignature(p);persist();
        exportReport=report;exportReportSignature=renderSignature;exportReportBacking=sourceBacking;exportReportVocal=sourceVocal;
      }
      toast(report.cautions.length?'WAV verified and downloaded. Review the export report for listening cautions.':'Your WAV passed the file and level checks. Keep the download safe.');
    }catch(err){toast(controller.signal.aborted?'WAV export cancelled. No original recordings were changed.':`Could not export: ${err.message}`,!controller.signal.aborted);}
    finally{if(wavExportAbort===controller)wavExportAbort=null;
      wavExportBusy=false;
      if(cancelButton)cancelButton.disabled=true;
      if(b.isConnected){b.disabled=false;b.innerHTML=label;}
      if(view==='finish')render();}
    break;
  }
  case 'cancel-native-export':{
    if(nativeExportAbort){b.disabled=true;nativeExportAbort.abort();toast('Stopping the native export…');}
    break;
  }
  case 'export-native-wav':{
    if(!nativeExportAvailable||!globalThis.wovennoteNative){toast('Native mixing is only available in the compiled Electron desktop app.',true);break;}
    if(recording||isSavingTake){toast('Finish recording before exporting.',true);break;}
    if(nativeExportAbort||wavExportBusy){toast('An export is already underway.');break;}
    const controller=new AbortController();nativeExportAbort=controller;
    b.disabled=true;const label=b.innerHTML;
    const cancelButton=document.querySelector('[data-action="cancel-native-export"]');
    const progressLabel=document.querySelector('#native-export-progress');
    if(cancelButton)cancelButton.disabled=false;
    const progress=event=>{
      if(controller.signal.aborted)return;
      const phase={render:'Rendering a stem',transfer:'Transferring audio',mix:'Mixing',scan:'Checking peaks',write:'Writing WAV',done:'Saved'}[event.phase]||'Exporting';
      b.textContent=`${phase} · ${Math.max(0,Math.min(100,event.percent||0))}%`;
      if(progressLabel)progressLabel.textContent=b.textContent;
    };
    try{
      const p=active();
      const config={backing:media.backing,vocal:media.vocal,backingGain:p.backingGain,vocalGain:p.vocalGain,
        sketch:!media.backing&&p.sketchMode!=='none'?songSketch(p):null,
        offsetMs:takeTimelineOffset(),vocalEdit:media.compActive?null:selectedTake()?.edit,
        vocalPolish:normalizeVocalPolish(p.vocalPolish)};
      if(songDuration()>600)throw new Error('The native export supports a maximum of ten minutes.');
      const result=await exportNativeInBlocks({config,name:slug(p.title),bridge:globalThis.wovennoteNative,signal:controller.signal,onProgress:progress});
      if(!result.cancelled)toast(`24-bit WAV saved using the native mixer (${result.stems} stem${result.stems===1?'':'s'}).`);
    }catch(error){
      if(controller.signal.aborted)toast('Native export cancelled. Your saved recordings are unchanged.');
      else toast(`Native export: ${error.message}`,true);
    }finally{
      nativeExportAbort=null;b.disabled=false;b.innerHTML=label;
      if(cancelButton)cancelButton.disabled=true;
      if(progressLabel)progressLabel.textContent='';
    }
    break;
  }
  case 'export-instrumental':
  case 'export-vocal':{
    if(wavExportBusy||nativeExportAbort){toast('Finish the current audio export before starting another.');break;}
    const instrumental=b.dataset.action==='export-instrumental';
    if(instrumental&&!media.backing&&active().sketchMode==='none'){toast('Enable a sketch or import backing audio first.');break;}
    if(!instrumental&&!media.vocal){toast('Record a vocal take first.');break;}
    wavExportBusy=true;b.disabled=true;const original=b.innerHTML;b.textContent='Rendering WAV…';
    try{
      const p=active();
      const sketch=instrumental&&!media.backing?songSketch(p):null;
      const wav=await mixToWav(instrumental?media.backing:null,instrumental?null:media.vocal,instrumental?p.backingGain:0,instrumental?0:p.vocalGain,sketch,instrumental?0:takeTimelineOffset(),instrumental||media.compActive?null:selectedTake()?.edit,instrumental?'off':normalizeVocalPolish(p.vocalPolish),{segmentedDry:true,onProgress:e=>{if(b.isConnected)b.textContent=`${e.phase==='scan'?'Checking peaks':'Encoding WAV'} · ${e.percent}%`;}});
      download(wav,`${slug(p.title)}-${instrumental?'instrumental':'vocal'}.wav`);
      toast(`${instrumental?'Instrumental':'Selected vocal'} WAV exported.`);
    }catch(e){toast(`Component export failed: ${e.message}`,true);}
    wavExportBusy=false;b.disabled=false;b.innerHTML=original;
    break;
  }
  case 'download-corrupt-index':{
    const raw=rawProjectRecovery();if(!raw){toast('Raw recovery data is inaccessible. Browser storage permissions may be blocked.',true);break;}
    download(new Blob([JSON.stringify({format:'wovennote-raw-storage-recovery',capturedAt:new Date().toISOString(),...raw},null,2)],{type:'application/json'}),'chordlore-recovery-index.json');
    toast('Downloaded raw metadata. Original voice recordings remain in local browser audio storage.');break;
  }
  case 'reset-corrupt-index':{
    if(!confirm('This will clear the damaged project index in this browser. Original audio may become orphaned and inaccessible. First download the raw recovery index. Only continue if you have backed up what you can. Reset the index?'))break;
    if(!unlockDamagedProjectIndex()){toast('Could not reset browser storage.',true);break;}
    projects=[newProject()];activeId=projects[0].id;saveFailed=!writeProjects(projects);writeActive(activeId);setView('home');toast('Started a fresh song index. Save a project backup.');break;
  }
  case 'export-arrangement-midi':{
    try {
      const midi=arrangementMidiBytes(active());
      download(new Blob([midi],{type:'audio/midi'}),`${slug(active().title)}-arrangement.mid`);
      toast('Editable multi-track MIDI exported. Open it in your music software to choose instruments and continue arranging.');
    } catch(error){toast(`Could not export MIDI: ${error.message}`,true);}
    break;
  }
  case 'export-writing':{
    try{download(new Blob([exportWritingText(active())],{type:'text/plain;charset=utf-8'}),`${slug(active().title)}-writing.txt`);toast('Text-only writing copy downloaded. This does not contain audio or restore your full session.');}
    catch(error){toast(`Could not export writing: ${error.message}`,true);}
    break;
  }
  case 'download-unsaved-audio':{
    if(!pendingAudioSave){toast('No unsaved recording is pending.',true);break;}
    const clip=pendingAudioSave.file;
    const subtype=clip.type.includes('wav')?'wav':clip.type.includes('ogg')?'ogg':clip.type.includes('mp4')?'m4a':'webm';
    download(clip,`${slug(pendingAudioSave.name||'unsaved-vocal')}-recovery.${subtype}`);
    toast('Unsaved original recording downloaded. Keep this file somewhere safe until your project is saved.');break;
  }
  case 'retry-unsaved-audio':{
    if(!pendingAudioSave){toast('No unsaved recording is pending.',true);break;}
    if(recording||isSavingTake){toast('Finish the current recording first.',true);break;}
    const pending=pendingAudioSave;
    await storeAudio('vocal',pending.file,pending.projectId,{punch:pending.punch});
    break;
  }
  case 'export-project':{
    b.disabled=true;try{download(await exportProjectArchive(active()),`${slug(active().title)}.chordlore.zip`);toast('Binary project backup downloaded, including every saved take. Keep it in a safe place.');}
    catch(err){toast('Could not export project: '+err.message,true);}b.disabled=false;break;
  }
  case 'import-project':closeModal();document.getElementById('project-import')?.click();break;
  case 'delete-project':{
    if(!confirm(`Delete “${active().title}” and its saved local audio?`))return;
    try{
      const result=await commitDeletedProject(activeId,projects);
      projects=result.projects;activeId=projects[0].id;saveFailed=false;
      writeActive(activeId);updateSaveStatus();setView('home');await hydrateMedia();
      if(result.warning)toast(result.warning,true);
      else toast('Song deleted and its saved audio cleared.');
    }catch(error){toast(error.message,true);}
    break;
  }
 }
}
async function handleChange(e){
 const t=e.target;
 if(t.id==='ai-task-select'){aiTask=t.value;render();return;}
 if(t.id==='ai-revision-scope'){const p=active();p.aiRevisionScope=revisionScopeAllowed(p.aiDraft?.editedText||p.lyrics,t.value)?t.value:'all';persist();return;}
 if(t.id==='creative-voice'){active().creativeVoice=['conversational','restrained','poetic','playful'].includes(t.value)?t.value:'conversational';persist();return;}
 if(t.dataset.field==='leadSound'){
   const next=normalizeLeadSound(t.value),p=active();
   if(p.leadSound!==next){p.leadSound=next;stopGuide();stopTransport();stopMelodyPreview();melodyIsPlaying=false;exportReport=null;exportReportSignature=null;persist();render();}
   return;
 }
 if(t.dataset.field==='drumFeel'){
   const next=normalizeDrumFeel(t.value),p=active();
   if(p.drumFeel!==next){p.drumFeel=next;stopGuide();stopTransport();exportReport=null;exportReportSignature=null;persist();render();}
   return;
 }
 if(t.dataset.field==='vocalPolish'){
   mixRecallUndo=null;mixAdvice=null;mixAdviceSignature=null;exportReport=null;exportReportSignature=null;exportReportBacking=null;exportReportVocal=null;
   active().vocalPolish=normalizeVocalPolish(t.value);
   stopTransport();persist();render();return;
 }

 if(t.dataset.compSection!=null){
  const p=active(),i=Number(t.dataset.compSection);
  if(Number.isInteger(i)&&i>=0&&i<normalizeArrangement(p.arrangement).length&&(p.takes||[]).some(take=>take.id===t.value)){
   p.compAssignments||={};p.compAssignments[i]=t.value;
   invalidateVocalComp();persist();render();
  }return;
 }

 if(t.dataset.arrangementChord!=null || t.dataset.arrangementTransition!=null){
   const p=active(),i=Number(t.dataset.arrangementChord??t.dataset.arrangementTransition),scenes=normalizeArrangement(p.arrangement);
   if(Number.isInteger(i)&&scenes[i]){
     if(t.dataset.arrangementChord!=null && [0,1,2,3].includes(Number(t.value)))scenes[i].chordOffset=Number(t.value);
     if(t.dataset.arrangementTransition!=null && TRANSITIONS.some(x=>x.id===t.value))scenes[i].transition=t.value;
     p.arrangement=scenes;invalidateVocalComp();stopGuide();stopTransport();persist();render();
   }return;
 }
 if(t.dataset.arrangementLevel!=null){
   const p=active(),i=Number(t.dataset.arrangementLevel),scenes=normalizeArrangement(p.arrangement);
   if(Number.isInteger(i)&&scenes[i]&&ARRANGEMENT_LEVELS.some(l=>l.id===t.value)){
      scenes[i].level=t.value;p.arrangement=scenes;invalidateVocalComp();stopGuide();stopTransport();persist();render();
   }return;
 }
 if(t.dataset.takeEdit){
   const take=selectedTake();
   if(!take||media.compActive||recording||isSavingTake)return;
   const duration=timeline.trackDuration('vocal');
   const key=t.dataset.takeEdit;
   if(!['trimStart','trimEnd','fadeInMs','fadeOutMs'].includes(key))return;
   if(!Number.isFinite(Number(t.value))||Number(t.value)<0){toast('Choose a positive cut or fade value.',true);render();return;}
   const previous=normalizeTakeEdit(take.edit);
   const candidate=normalizeTakeEdit({...previous,[key]:Number(t.value)});
   if(!takeEditBounds(duration,candidate)){toast('Leave at least 0.01 seconds of audio. The original is unchanged.',true);render();return;}
   take.edit=candidate;
   stopTransport();invalidateVocalComp();persist();render();toast('Non-destructive vocal edit saved.');return;
 }
 if(t.id==='melody-line-select'){active().melodyLineIndex=Number(t.value);persist();render();return;}
 if(t.id==='melody-upload'&&t.files?.[0]){await analyzeMelodyBlob(t.files[0],'Imported humming audio');t.value='';return;}
 if(t.id==='melody-midi-import'&&t.files?.[0]){
  const incoming=t.files[0];t.value='';
  try{
   if(incoming.size>1048576)throw new Error('Choose a MIDI file smaller than 1 MB.');
   const imported=importMidiMelody(await incoming.arrayBuffer());
   const p=active();
   if(normalizeMelody(p.melodyNotes).length && !confirm(`Replace the current melody with ${imported.notes.length} notes from “${imported.trackName}”? Your lyrics and original recordings will stay unchanged.`))return;
   const original=p.melodyNotes,origin=p.melodyOrigin;
   p.melodyNotes=imported.notes;p.melodyOrigin=`MIDI import · ${imported.trackName}`.slice(0,100);
   if(!persist()){
    p.melodyNotes=original;p.melodyOrigin=origin;
    throw new Error('Your device could not save the imported melody. The previous notes were restored.');
   }
   stopGuide();stopTransport();stopMelodyPreview();melodyIsPlaying=false;melodySelectedIndex=0;
   exportReport=null;exportReportSignature=null;
   render();
   const tempo=imported.sourceBpm&&Math.abs(imported.sourceBpm-p.bpm)>1?` Source MIDI suggests ${imported.sourceBpm} BPM; your song remains ${p.bpm} BPM.`:'';
   toast(`${imported.notes.length} editable MIDI notes imported.${tempo}${imported.warning?' Some overlapping or excess notes were skipped; review by ear.':''}`);
  }catch(err){toast(`Could not import MIDI: ${err.message}`,true);}
  return;
 }

 if(t.id==='flow-line-select'){
   stopPhrasePreview();phraseIsPlaying=false;
   active().flowFocusLine=Number(t.value);persist();render();return;
 }
 if(t.id==='countin-bars'){
   active().countInBars=normalizeCountInBars(t.value);persist();render();return;
 }
 if(t.id==='punch-preroll'){
   active().punchPreRoll=!!t.checked;persist();render();return;
 }
 if(t.id==='recording-click'){
   active().recordingClick=!!t.checked;persist();render();return;
 }
 if(t.id==='microphone-select'){
   selectedMic=t.value;const testing=!!inputMeter;stopInputMeter();
   if(testing)await startInputTest();else render();return;
 }
 if(t.dataset.cueValue!=null){
   const i=Number(t.dataset.cueValue),value=t.value.trim();
   if(value==='')delete active().cues[i];
   else if(Number.isFinite(Number(value))&&Number(value)>=0&&Number(value)<=600)active().cues[i]=Math.round(Number(value)*10)/10;
   persist();updatePlayhead();return;
 }
 if(t.id==='backing-upload'&&t.files?.[0]){await storeAudio('backing',t.files[0]);t.value='';}
 if(t.id==='vocal-upload'&&t.files?.[0]){await storeAudio('vocal',t.files[0]);t.value='';}
 if(t.id==='lyrics-file'&&t.files?.[0]){
  if(t.files[0].size>1024*1024){toast('Plain text files must be below 1 MB.',true);return;}
  try{field('lyrics',await t.files[0].text());render();toast('Lyrics imported.');}catch(err){toast(err.message,true);}
 }
 if(t.id==='project-import'&&t.files?.[0]){
  try{
    const incoming=t.files[0];
    const zipHeader=typeof incoming.slice==='function' ? new Uint8Array(await incoming.slice(0,4).arrayBuffer()) : null;
    const isZip=zipHeader?.[0]===80&&zipHeader?.[1]===75&&zipHeader?.[2]===3&&zipHeader?.[3]===4;
    const p=isZip?await importProjectArchive(incoming):await importProjectFile(incoming);
    p.updatedAt=Date.now();
    const updated=await commitImportedProject(p,projects);
    projects=updated;activeId=p.id;saveFailed=false;
    writeActive(activeId);updateSaveStatus();setView('story');await hydrateMedia();
    toast('Project imported and saved, including its audio.');
  }
  catch(err){toast(`Import failed: ${err.message}`,true);}t.value='';
 }
}
function handleInput(e){
 const t=e.target,name=t.dataset.field;
 if(t.dataset.blueprint){const key=t.dataset.blueprint;if(BLUEPRINT_FIELDS.some(x=>x.id===key)){active().blueprint=normalizeBlueprint({...active().blueprint,[key]:t.value});persist();const badge=document.querySelector('.blueprint-card .small-tag');if(badge)badge.textContent=blueprintProgress(active().blueprint).complete+' / 4 ideas';}return;}
 if(t.id==='song-map-intent'){
   const p=active();p.songMap=normalizeSongMap({...p.songMap,[songMapStage]:t.value});persist();
   const badge=document.querySelector('.song-map-card .small-tag');if(badge)badge.textContent=songMapProgress(p.songMap)+' of 4 ideas saved';return;
 }
 if(t.id==='interview-answer'){active().interviewDraft=t.value.slice(0,6000);persist();return;}
 if(t.id==='creative-truth'){active().creativeTruth=t.value.slice(0,280);persist();return;}
 if(t.id==='creative-avoid'){active().creativeAvoid=t.value.slice(0,500);persist();return;}
 if(t.id==='ai-steer'){active().aiInstruction=t.value.slice(0,600);persist();return;}
 if(t.id==='ai-revision-feedback'){active().aiRevisionFeedback=t.value.slice(0,1200);persist();return;}
 if(t.id==='ai-draft-preview'){const p=active();if(p.aiDraft){p.aiDraft.editedText=t.value.slice(0,16000);persist();}return;}
 if(t.id==='weave-preview'){
  const p=active();if(p.weaveDraft){p.weaveDraft.editedText=t.value.slice(0,24000);persist();}
  return;
 }
 if(t.dataset.takeOffset!=null){
   const take=selectedTake();if(take){take.offsetMs=normalizeOffsetMs(t.value);persist();
     const label=document.getElementById('take-offset-label');if(label)label.textContent=`${take.offsetMs>0?'+':''}${take.offsetMs} ms`;
   }return;
 }
 if(t.id==='song-seek'||t.id==='session-seek'){
   if(recording || isSavingTake)return;
   const seconds=Number(t.value);
   void timeline.seek(seconds).catch(e=>toast(e.message,true));
   const label=document.getElementById('seek-value');if(label)label.textContent=formatTime(seconds);
   updatePlayhead();return;
 }
 if(!name)return;
 // Select changes are committed transactionally in handleChange, not input.
 if(name==='drumFeel'||name==='leadSound')return;
 field(name,t.value);
 if(['story','brief','lyrics'].includes(name)){
   const atlas=document.getElementById('story-atlas');
   if(atlas)atlas.outerHTML=atlasPanel(active());
   const weave=document.getElementById('song-weave');
   if(weave)weave.outerHTML=weavePanel(active());
 }
 if(name==='lyrics'){
   if(t.id==='lyric-editor'){
     const el=document.getElementById('lyric-metrics');if(el)el.innerHTML=renderMetrics(t.value);
     const review=document.getElementById('lyric-review');if(review)review.outerHTML=lyricReviewPanel(active());
     stopPhrasePreview();phraseIsPlaying=false;
     const phrase=document.getElementById('phrase-lab');if(phrase)phrase.outerHTML=phraseLab(active());
     if(lineWorkbenchOpen){syncLyricFocusFromCaret(t,false);const panel=document.getElementById('line-workbench');if(panel)panel.outerHTML=lineWorkbench(active());}
     const words=(t.value.match(/\b\S+\b/g)||[]).length;
     const meta=document.getElementById('lyric-word-count');if(meta)meta.textContent=words+' words';
     const stat=document.getElementById('metric-words');if(stat)stat.textContent=words;
     const count=document.getElementById('metric-lines');if(count)count.textContent=lyricLines(t.value).filter(l=>!l.section&&!l.empty).length;
   }
 }
 if(name==='bpm'){const value=document.getElementById('bpm-value');if(value)value.textContent=t.value;}
 if(name==='vocalGain'||name==='backingGain'){
   const id=name==='vocalGain'?'vocal-gain-value':'backing-gain-value';
   const el=document.getElementById(id);if(el)el.textContent=Math.round(Number(t.value)*100)+'%';
   const versions=document.querySelector('.mix-versions-panel');
   if(versions){const nameValue=document.getElementById('mix-version-name')?.value||'';versions.outerHTML=mixVersionsPanel(active());const updatedName=document.getElementById('mix-version-name');if(updatedName)updatedName.value=nameValue;}
 }
}
document.addEventListener('click',e=>{void handleClick(e);});
root.addEventListener('change',e=>{void handleChange(e);});
root.addEventListener('input',handleInput);
root.addEventListener('keyup',e=>{if(e.target.id==='lyric-editor')syncLyricFocusFromCaret(e.target);});
root.addEventListener('click',e=>{if(e.target.id==='lyric-editor')syncLyricFocusFromCaret(e.target);});
root.addEventListener('toggle',e=>{if(e.target.classList?.contains('interview-answers'))interviewHistoryOpen=e.target.open;},true);
document.addEventListener('click',e=>{if(e.target.matches('.modal-backdrop'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('beforeunload',event=>{
 if(recording || isSavingTake || pendingAudioSave){event.preventDefault();event.returnValue='';}
});
// Keep the backup file input outside the view tree so it survives re-renders.
const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='.zip,.json,application/zip,application/json';fileInput.id='project-import';fileInput.hidden=true;document.body.appendChild(fileInput);fileInput.addEventListener('change',e=>{void handleChange(e);});
render();hydrateMedia();void inspectSavedAudio();
if(globalThis.wovennoteNative?.deviceStatus){
  void globalThis.wovennoteNative.deviceStatus().then(info=>{
    nativeDeviceAvailable=info?.available===true;
    if(view==='record')render();
  }).catch(()=>{nativeDeviceAvailable=false;});
}
if(globalThis.wovennoteNative?.status){
  void globalThis.wovennoteNative.status().then(status=>{
    nativeExportAvailable=status?.available===true;
    if(view==='finish')render();
  }).catch(()=>{nativeExportAvailable=false;});
}
