/* 0.2: Story Atlas and recording vault. Deliberately separate from legacy theme rules. */
.atlas-card { border-color: #484052; background: radial-gradient(circle at 100% 0%, #32283f80, #191b24 57%); }
.atlas-card .card-top h3 { max-width: 390px; }
.atlas-motifs { margin: 22px 0 18px; display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
.atlas-motifs small { font-size:9px;font-weight:800;letter-spacing:1.35px;color:#a5a0b0;margin-right:8px; }
.atlas-motifs span {border:1px solid #534960;background:#292533;padding:6px 11px;border-radius:30px;font-size:11px;color:#e1d3f1;}
.atlas-empty {margin:18px 0;color:#a6a2b3;padding:14px 16px;border:1px dashed #51485b;border-radius:12px;font-size:12px;line-height:1.55;}
.atlas-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:19px;}
.atlas-route {min-width:0;min-height:241px;background:#23202d;border:1px solid #494052;color:#eee8f6;border-radius:12px;padding:19px 14px;display:flex;flex-direction:column;text-align:left;gap:11px;transition:transform .18s,border-color .18s,background .18s;}
.atlas-route:hover {transform:translateY(-3px);background:#30293c;border-color:#a18abd;}
.atlas-route.active {background:#322842;border-color:#c2a7e9;box-shadow:inset 0 0 0 1px #c2a7e944;}
.route-number {font-size:9px;font-weight:800;letter-spacing:1.3px;color:#b7a2d1;}
.atlas-route strong {font:normal 22px/1.06 Georgia,serif;color:#f8f3f8;}
.route-angle {font-size:11px;line-height:1.48;color:#c3b9cc;}
.atlas-route q {display:block;color:#ac9bab;font-size:10px;line-height:1.4;margin-top:auto;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-style:italic;}
.route-footer {margin-top:auto;padding-top:8px;border-top:1px solid #54485d;display:flex;align-items:center;justify-content:space-between;gap:6px;color:#d5c2e1;font-size:10px;font-weight:700;}
.chosen-story {margin-top:20px;background:#252434;border:1px solid #6c5377;padding:19px;border-radius:12px;display:grid;gap:8px;}
.chosen-story>span{font-size:9px;letter-spacing:1px;color:#ccbbea;display:flex;gap:8px;align-items:center;font-weight:800;}
.chosen-story strong{font:normal 22px Georgia,serif;}
.chosen-story p{font-size:11px;margin:0;color:#b4a9ba;}
.chosen-story .text-link{margin-top:4px;}
.atlas-disclaimer {font-size:10px!important;color:#888695!important;margin:18px 0 0!important;}
.song-direction-ribbon {background:#252234;border:1px solid #4c455c;border-radius:11px;display:flex;align-items:center;gap:12px;padding:12px 15px;margin:0 0 18px;color:#cbbbe6;font-size:12px;}
.song-direction-ribbon span{flex:1;color:#bcb6c5;}.song-direction-ribbon strong{color:#eee7fa;}
.phrase-label{display:block!important;font-size:9px!important;color:#b8a5d4!important;font-weight:600;padding-top:4px;}
.take-vault {border-color:#4b414b;background:linear-gradient(135deg,#201d29,#1a1b24 70%);}
.take-list {display:grid;gap:8px;margin-top:18px;margin-bottom:16px;}
.take-row {display:flex;align-items:center;gap:10px;border:1px solid #3c394a;border-radius:10px;background:#22222d;padding:11px;min-width:0;}
.take-row.chosen {border-color:#a996ca;background:#302a3d;}
.take-index {width:33px;height:33px;display:grid;place-items:center;background:#40344e;border-radius:8px;color:#ddcbea;font-size:11px;font-weight:800;flex-shrink:0;}
.take-description {min-width:0;display:flex;flex:1;flex-direction:column;gap:5px;}
.take-description strong{font-size:12px;color:#f2edf6;}.take-description small{font-size:10px;color:#aa9db4;}
.take-row .small-action {white-space:nowrap;flex-shrink:0;}
.take-row .small-action.icon-only {padding:9px;}
.take-vault .take-wave{margin:15px 0;}
.take-vault .take-actions{margin-top:11px;}
@media(max-width:1250px){.atlas-grid{grid-template-columns:1fr}.atlas-route{min-height:0}.atlas-route strong{font-size:21px}.atlas-route q{margin-top:0}}

.sketch-export{margin:20px 0;padding:18px;background:#252331;border:1px solid #50465f;border-radius:12px;display:grid;grid-template-columns:1fr repeat(2,minmax(120px,.56fr));gap:15px;align-items:end;}
.sketch-export strong{font-size:12px;color:#f5eef8}.sketch-export p{font-size:11px;color:#b1a6bc;margin:6px 0 0;line-height:1.5;}

@media(max-width:850px){.sketch-export{grid-template-columns:1fr 1fr}.sketch-export>div{grid-column:1/-1}}
.origins-panel {background:linear-gradient(120deg,#1b1e28,#292231);border-color:#484052;}

.origin-row span{font-size:12px;color:#f2eaf4;font-family:Georgia,serif;line-height:1.5;}
.origin-row small{font-size:10px;color:#aaa3b5;}

/* 0.3 — Rehearsal timing and reliable input setup. */
.mic-setup {background:linear-gradient(140deg,#1d222d,#1c1c27 80%);border-color:#464c5d;}
.mic-row {display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:17px 0 16px;}
.mic-label {display:flex;flex:1;min-width:180px;flex-direction:column;gap:8px;font-size:10px;letter-spacing:.35px;font-weight:800;color:#c5c1cf;}
.mic-label select {background:#2b2c38;color:#f7edf9;border:1px solid #535267;border-radius:9px;padding:11px 12px;max-width:100%;font-size:12px;outline-offset:2px;}
.mic-row .small-action {min-height:40px;display:flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap;}
.input-meter-row {display:flex;align-items:center;gap:12px;}
.input-meter {height:10px;border-radius:999px;flex:1;overflow:hidden;background:#343540;border:1px solid #535360;}
.input-meter>span {display:block;height:100%;background:linear-gradient(90deg,#9fceb3,#98c6cb 60%,#f3b48c);border-radius:inherit;transition:width 65ms linear;}
#input-meter-value {font-size:10px;min-width:76px;text-align:right;color:#c5c5ce;font-variant-numeric:tabular-nums;}
.mic-disclaimer {font-size:10px!important;color:#8b90a0!important;margin:16px 0 0!important;line-height:1.5;}
.cue-panel {background:linear-gradient(110deg,#231f2c,#1c2029);border-color:#4c455a;}
.cue-row {display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:15px;}
.cue-row button {display:flex;align-items:center;gap:6px;}
.cue-row>span {font-size:10px;color:#a9a6b4;margin-left:auto;}
.cue-tools {display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:nowrap;}
.perform-line {gap:10px;}
.perform-line>span {min-width:0;flex:1;}
.cue-input-label {display:flex;align-items:center;gap:5px;color:#a4a0b2;font-size:9px;letter-spacing:.25px;white-space:nowrap;}
.cue-input-label input {width:65px;min-width:0;padding:7px 6px;background:#222633;color:#f5f0f9;border:1px solid #565366;border-radius:6px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;}
.cue-tools>button {white-space:nowrap;display:flex;align-items:center;gap:5px;}
.seek-row {display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:18px;border-top:1px solid #454052;padding-top:16px;}
.seek-row label,.seek-row span {font-size:10px;color:#c9c3d6;}
.seek-row input {width:100%;accent-color:#c5a6ec;}
.take-alignment {display:flex;align-items:center;gap:24px;padding:17px;background:#302a39;border-radius:10px;border:1px solid #67546c;flex-wrap:wrap;margin-bottom:14px;}
.take-alignment>div:first-child {flex:1;min-width:180px;}
.take-alignment strong {font-size:12px;color:#f6ebf6;}
.take-alignment p {font-size:11px;color:#baaabe;line-height:1.6;margin:8px 0 0;}
.take-offset-controls {display:grid;grid-template-columns:minmax(140px,1fr) 56px auto;gap:9px;align-items:center;min-width:290px;flex:1;}
.take-offset-controls input{width:100%;accent-color:#cfb3ea;}
.take-offset-controls output{color:#e4cef2;font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap;}
.take-offset-controls .small-action{font-size:10px;}
.record-button:disabled{opacity:.65;cursor:wait;}
@media(max-width:600px){.mic-row{align-items:stretch}.mic-label{min-width:100%}.mic-row .small-action{flex:1}.cue-tools{flex-wrap:wrap;justify-content:end}.cue-input-label input{width:56px}.take-offset-controls{min-width:0;width:100%;grid-template-columns:1fr 60px;}.take-offset-controls .small-action{grid-column:1/-1}.cue-row>span{margin-left:0;width:100%}}

/* 0.4 · Phrase Lab — purpose-built prosody workspace. */
.phrase-lab {border-color:#5a4e6a;background:radial-gradient(circle at 90% -5%,#3b304a95,transparent 48%),linear-gradient(140deg,#1e202b,#211e2a);margin-bottom:23px;}
.phrase-lab .card-top h3{max-width:480px;line-height:1.1;}
.flow-line-select{display:grid;gap:9px;margin:23px 0 16px;color:#b4a8c8;font-size:10px;font-weight:800;letter-spacing:1.2px;}
.flow-line-select select{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #5a5169;background:#2a2635;color:#f3eefa;font-family:inherit;font-size:12px;letter-spacing:0;font-weight:500;}
.flow-groove-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:10px 0 19px;}
.flow-groove{min-width:0;display:flex;flex-direction:column;gap:9px;text-align:left;min-height:167px;border-radius:13px;background:#24232f;border:1px solid #454456;padding:16px;color:#e3dfea;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;}
.flow-groove:hover{border-color:#b3a1c6;transform:translateY(-2px);}
.flow-groove.chosen{background:#302b3c;border-color:var(--flow-color);box-shadow:inset 0 0 0 1px var(--flow-color);}
.flow-groove-top{display:flex;justify-content:space-between;align-items:center;color:var(--flow-color);font-size:11px;font-weight:800;}
.flow-groove strong{font:normal 24px/1.0 Georgia,serif;color:#fcf6f3;}
.flow-groove small{font-size:10px;line-height:1.5;color:#b6aec1;}
.flow-groove-bottom{margin-top:auto;font-size:10px;letter-spacing:.35px;font-weight:750;color:var(--flow-color);}
.flow-score{border:1px solid #59506a;border-radius:13px;padding:19px;background:#171a25;}
.flow-score-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:10px;font-weight:800;letter-spacing:1px;color:#b7a8cb;margin-bottom:22px;}
.flow-score-head span:last-child{font-variant-numeric:tabular-nums;color:#e0c0a4;letter-spacing:0;}
.flow-words{display:flex;flex-wrap:wrap;align-items:end;gap:7px;min-height:66px;margin-bottom:18px;}
.flow-word{display:grid;gap:5px;min-width:50px;min-height:53px;padding:9px 11px;border-radius:9px;border:1px solid #454459;background:#242333;color:#e7e0f1;cursor:pointer;text-align:center;transition:background .12s,border-color .12s,transform .12s;}
.flow-word strong{font:500 13px/1.2 Georgia,serif;}.flow-word small{color:#938da7;font-size:9px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.flow-word:hover{border-color:#b3a1c6;transform:translateY(-1px);}.flow-word.emphasized{background:#4b3d55;border-color:#dab3e6;}.flow-word.emphasized small{color:#eed5f4;}
.flow-word.flow-active{background:#dfb690;border-color:#eec7a7;color:#241f26;}.flow-word.flow-active small{color:#584536;}
.flow-ruler{display:flex;gap:2px;min-height:18px;align-items:center;overflow:hidden;padding-bottom:3px;}
.flow-tick{display:block;flex:1;min-width:2px;height:6px;border-radius:2px;background:#4b475b;}
.flow-tick.bar-start{height:13px;background:#b08e70;}.flow-tick.word-stress{height:17px;background:#d6a4df;}
.flow-caption{margin-top:11px;color:#a8a2b6;font-size:10px;line-height:1.6;}
.flow-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start;align-items:center;margin-top:16px;}
.flow-actions button{display:flex;gap:9px;align-items:center;}
.flow-note{margin-top:15px;color:#9591a2;font-size:10px;line-height:1.8;border-top:1px solid #474252;padding-top:14px;}
@media(max-width:900px){.flow-groove-grid{grid-template-columns:1fr 1fr}.flow-groove{min-height:145px}.flow-groove:last-child{grid-column:1/-1;min-height:115px}}
@media(max-width:600px){.flow-groove-grid{grid-template-columns:1fr}.flow-groove,.flow-groove:last-child{grid-column:1;min-height:120px}.flow-actions{flex-direction:column;align-items:stretch}.flow-actions button{justify-content:center}.flow-score{padding:13px}.flow-word{min-width:43px;padding:8px}}

/* 0.5 — Shared-session timeline: a single transport for voice and accompaniment. */
.timeline-card{background:radial-gradient(ellipse at 100% 0%,#2b283b 0%,#1b1d29 52%);border-color:#4a445b;overflow:hidden}
.timeline-card .card-top h3{letter-spacing:-.8px}
.timeline-live{display:flex;align-items:center;gap:7px;font-size:9px;color:#b1dbc7;letter-spacing:1px;font-weight:800;white-space:nowrap}
.timeline-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 11px;font-variant-numeric:tabular-nums}
.timeline-head strong{font:normal 29px Georgia,serif;color:#fff5ee}
.timeline-head span{font-size:9px;color:#b2a9c7;letter-spacing:1px}
.timeline-surface{position:relative;background:#141721;border:1px solid #414354;border-radius:13px;padding:17px 16px;overflow:hidden}
.timeline-ruler,.timeline-lane,.timeline-cue-rail{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;align-items:center}
.timeline-ruler{padding:0 0 11px}
.timeline-ruler-labels{grid-column:2;grid-row:1;display:flex;justify-content:space-between;pointer-events:none;color:#9294a8;font-size:9px;font-variant-numeric:tabular-nums}
.timeline-ruler input{grid-column:2;grid-row:2;width:100%;height:13px;accent-color:#d3b7ea;cursor:ew-resize;position:relative;z-index:3}
.timeline-lane{padding:5px 0}
.timeline-lane-label{font-size:10px;font-weight:750;color:#c8c2d5}
.timeline-lane-rail{height:58px;background:repeating-linear-gradient(90deg,#1a1c29 0 1px,#202330 1px 25%);border:1px solid #343747;border-radius:8px;position:relative;overflow:hidden}
.timeline-clip{position:absolute;top:5px;bottom:5px;border:1px solid #d6acdd66;border-radius:6px;background:linear-gradient(100deg,#604a79,#362f50);overflow:hidden;min-width:1px}
.timeline-clip.vocal{border-color:#dba18d88;background:linear-gradient(100deg,#75514f,#442c3b)}
.timeline-clip .wave-bars{height:100%;min-width:160px;opacity:.8;padding:5px 3px;display:flex;align-items:center;gap:2px}
.timeline-clip .wave-bars i{background:#dfbeff;flex:1;min-width:1px;border-radius:2px}
.timeline-clip.vocal .wave-bars i{background:#f6b8a3}
.timeline-clip.sketch{background:repeating-linear-gradient(90deg,#3d4e55 0 12px,#344349 12px 25px);border-color:#7eaaac88;display:grid;place-items:center}
.timeline-clip.sketch span{font-size:8px;font-weight:800;letter-spacing:1.4px;color:#c5ece5}
.timeline-empty{font-size:10px;color:#687080;display:grid;place-items:center;height:100%;font-style:italic}
.timeline-cue-rail{margin-top:11px}

.timeline-cue-rail>div{height:13px;border-bottom:1px solid #373b47;position:relative}
.timeline-cue-rail i{width:3px;position:absolute;top:1px;height:10px;background:#d6b6a5;border-radius:3px}
.timeline-playhead{position:absolute;top:33px;bottom:18px;width:1px;background:#e4c2ab;pointer-events:none;opacity:.65;transition:left 70ms linear}
.timeline-playhead:before{content:'';position:absolute;top:-4px;left:-3px;width:7px;height:7px;background:#e4c2ab;border-radius:50%}
@media(max-width:720px){.timeline-card{padding:17px}.timeline-live{font-size:8px}.timeline-ruler,.timeline-lane,.timeline-cue-rail{grid-template-columns:60px minmax(0,1fr);gap:8px}.timeline-playhead{display:none}.timeline-lane-label{font-size:9px}.timeline-surface{padding:12px 9px}}
.component-export{border-top:1px solid #414252;margin-top:21px;padding-top:21px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.component-export strong{font-size:12px;color:#f0e7f1}
.component-export p{font-size:10px;color:#9797aa;line-height:1.5;margin:6px 0 0}
.component-export>div:last-child{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.component-export .small-action:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:850px){.component-export{align-items:flex-start;flex-direction:column}.component-export>div:last-child{width:100%}.component-export .small-action{flex:1}}

/* 0.6 Melody Lab: compact edit-friendly piano roll for non-musicians. */
.melody-lab{background:linear-gradient(145deg,#222032,#1a202a 72%);border-color:#625475;overflow:hidden;}

.melody-status span{display:inline-flex;align-items:center;gap:7px;}
.melody-piano-scroll{width:100%;overflow:auto;border:1px solid #575068;border-radius:12px;background:#191c2a;max-height:425px;}

.melody-block{position:absolute;display:block;z-index:1;height:10px;padding:0 3px;border:1px solid #b8a2df;background:linear-gradient(110deg,#9e79cd,#7055a2);border-radius:3px;color:#fff;font-size:8px;line-height:8px;white-space:nowrap;overflow:hidden;cursor:pointer;text-align:left;box-shadow:0 2px 5px #0004;min-width:12px;}

.melody-edit-buttons svg{transform:rotate(90deg)}
.melody-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;}

.melody-footer .text-button{margin-left:auto;color:#b7adcc;}
.melody-empty{min-height:162px;border:1px dashed #6b607e;border-radius:12px;background:radial-gradient(ellipse at 30% 5%,#423351,#282431 73%);padding:22px 19px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:8px;}
.melody-empty .melody-symbol{font-size:42px;color:#d6bbf1;}
.melody-empty strong{font:normal 22px Georgia,serif;color:#eee3f7;}
.melody-empty p{max-width:480px;margin:0;color:#b4aabf;font-size:11px;}
.melody-disclaimer{margin:17px 0 0!important;font-size:10px!important;color:#938b9e!important;line-height:1.6!important;}
@media(max-width:620px){.melody-actions .small-action{width:100%;}.melody-edit-buttons button{min-height:38px}.melody-footer .button{flex:1}.melody-footer .text-button{margin-left:0}}
.melody-fit{padding:17px 18px;margin:10px 0 18px;background:linear-gradient(115deg,#292538,#21232f);border:1px solid #554a65;border-radius:11px;}
.melody-fit-head{display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap;}

.melody-fit-head select{font-size:11px;max-width:290px;min-width:150px;background:#322b40;border:1px solid #655574;color:#ede2f8;border-radius:8px;padding:9px 11px;}
.melody-fit-stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:17px;}
.melody-fit-stats>span{border:1px solid #51485a;background:#302b39;padding:7px 10px;border-radius:8px;color:#c9bdd2;font-size:10px;display:inline-flex;align-items:center;gap:5px;}

.melody-fit-stats>.melody-fit-status{color:#d9c4ec;background:#3b2d46;border-color:#765c86;}

/* 0.7 — Song Weave: human-readable evidence and deliberately non-destructive drafting. */

.weave-source q{font:italic 12px/1.5 Georgia,serif;color:#d6c6d8;}
.weave-next{display:grid;gap:8px;margin:19px 0 0;}
.weave-next p{margin:0!important;display:flex;gap:8px;align-items:start;font-size:11px!important;color:#b9c7ba!important;}

.weave-revision{border:1px solid #655777;background:#282636;padding:14px 15px;border-radius:11px;margin:0 0 18px;display:flex;gap:11px;align-items:center;}

@media(max-width:650px){.weave-revision{flex-wrap:wrap}.weave-revision button{width:100%}.weave-editor{padding:16px;min-height:250px}}

/* 0.7 — Harmony Compass pairs a locally detected melody with optional chords. */
.harmony-lab{background:linear-gradient(140deg,#202d2d,#1c222b 70%);border-color:#456b67;}
.harmony-lab .card-top h3{font-size:27px;letter-spacing:-.5px;}
.harmony-top{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin:19px 0;}

.harmony-option:hover{background:#293b3e;border-color:#86bcb0;}.harmony-option.chosen{border-color:#a1e5c7;box-shadow:inset 0 0 0 1px #a1e5c74d;background:#2b403f;}
.harmony-name{font:normal 20px Georgia,serif;color:#e7f4e9;line-height:1.1;display:flex;align-items:center;justify-content:space-between;gap:5px;}
.harmony-name strong{font:800 8px sans-serif;letter-spacing:.7px;color:#a1e5c7;}
.harmony-key{font-size:10px;color:#b3d1c4;}
.harmony-chords{display:flex;gap:5px;flex-wrap:wrap;}.harmony-chords i{font:700 11px sans-serif;font-style:normal;color:#e8f3ed;border-radius:7px;border:1px solid #567571;background:#304646;padding:7px 8px;}
.harmony-description{font-size:11px;color:#b6c6c3;line-height:1.5;}
.harmony-selected{margin-top:16px;padding:13px 15px;background:#273d38;border:1px solid #548574;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.harmony-selected>div{display:flex;align-items:center;gap:8px;color:#d4ebdf;font-size:12px;}
.harmony-selected>div span{display:grid;gap:6px;}.harmony-selected small{font-size:10px;color:#f1c9ac;line-height:1.4;}
.harmony-footnote{margin-top:16px!important;font-size:10px!important;color:#a0b1aa!important;}
@media(max-width:850px){.harmony-choices{grid-template-columns:1fr}.harmony-option{min-height:auto}.harmony-name{font-size:22px;}}

.weave-changed{padding:12px 13px;border:1px solid #96795a;background:#3d3129;border-radius:9px;color:#f2d1a5!important;font-size:11px!important;line-height:1.5!important;}

.harmony-stale{border:1px solid #8c7754;background:#403527;border-radius:9px;padding:12px;color:#f3d9ad!important;font-size:11px!important;}

/* 0.8 — A visible path to a finished recording, with no mandatory order. */
.journey-ribbon{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 19px;margin:17px 0 30px;border:1px solid #4d435b;background:linear-gradient(105deg,#23212e,#1a2329);border-radius:14px;}
.journey-progress{min-width:145px;display:grid;gap:7px}.journey-progress>span{font-size:9px;letter-spacing:1.25px;color:#ad9ebc;font-weight:800}.journey-progress strong{font-size:12px;color:#e3d6eb}.journey-bar{height:4px;background:#383844;border-radius:8px;overflow:hidden}.journey-bar i{display:block;background:linear-gradient(90deg,#b89ce6,#a9dec6);height:100%;border-radius:8px;transition:width .2s}
.journey-mini{flex:1;min-width:220px;display:flex;flex-wrap:wrap;gap:6px}.journey-stop{display:flex;align-items:center;gap:6px;min-height:31px;padding:6px 8px;border:1px solid #3b3c48;color:#8c91a0;background:#21242d;border-radius:7px;font-size:10px;white-space:nowrap}.journey-stop.done{color:#b9e5ca;border-color:#446854;background:#23342e}.journey-stop.here{outline:1px solid #a294ca;outline-offset:1px}.journey-stop:hover{background:#31313f;color:white}.journey-next,.journey-finished{display:inline-flex;gap:6px;align-items:center;color:#e5d5f7;font-size:11px;font-weight:700;background:#383045;border:1px solid #675678;border-radius:8px;padding:11px 13px}.journey-finished{background:#263b32;border-color:#497e63;color:#d4f1df}
/* Pocket Composer is original synth percussion, not a sample-based DAW. */
.pocket-composer{background:linear-gradient(145deg,#25232c,#191f29);border-color:#5a506b}.pocket-composer .card-top h3{font-size:26px}.pocket-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:20px 0 11px}.pocket-meter{font-size:11px;letter-spacing:.6px;color:#cfbfdc;font-weight:750}.pocket-head .pocket-on{background:#264c41;color:#c7f4dd;border-color:#5c9e84}.pocket-presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.pocket-preset{border:1px solid #52445d;background:#302938;color:#dbcbe6;font-size:10px;font-weight:700;border-radius:7px;padding:9px 12px}.pocket-preset:hover{border-color:#b9a2d3;background:#49374b}
.pocket-scroll{max-width:100%;overflow:auto;background:#151922;border:1px solid #3b3b4b;border-radius:11px;padding:16px 12px;scrollbar-color:#6d6080 #151922}.pocket-grid{display:grid;grid-template-columns:88px repeat(var(--drum-steps),minmax(24px,1fr));gap:5px;width:max(100%,580px);align-items:center}.pocket-lane-head,.pocket-step-num{font-size:9px;color:#777d8e;text-align:center;letter-spacing:.3px}.pocket-lane-head{text-align:left;padding:0 9px}.pocket-step-num.strong{font-weight:800;color:#c3b4d4}.pocket-lane-name{display:grid;gap:3px;padding:0 6px}.pocket-lane-name strong{color:#e7ddec;font-size:11px}.pocket-lane-name small{font-size:9px;color:#7f8290}.pocket-step{display:grid;place-items:center;width:100%;height:33px;border:1px solid #393e4d;border-radius:5px;background:#272c39;cursor:pointer;transition:background .1s,border-color .1s}.pocket-step.downbeat{border-left:2px solid #7d708d;background:#2d3040}.pocket-step:hover{border-color:#c8b2ef}.pocket-step:focus-visible{outline:2px solid #f4d0aa;outline-offset:1px}.pocket-step.active{background:#bc9fe4;border-color:#d4c0f0;box-shadow:0 0 0 1px #bea3e548 inset}.pocket-step.lane-kick.active{background:#d2b1ed}.pocket-step.lane-snare.active{background:#e6a8b9}.pocket-step.lane-hat.active{background:#9bd0c5}.pocket-step.lane-clap.active{background:#e9c596}
.pocket-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:17px}.pocket-footer>span{font-size:11px;color:#a6a0b0}.pocket-footer>div{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.pocket-footer button:disabled{opacity:.45;cursor:not-allowed}.pocket-note{font-size:10px!important;color:#8d91a2!important;margin:17px 0 0!important;max-width:none!important}
@media(max-width:600px){.journey-ribbon{padding:13px}.journey-progress{width:100%}.journey-mini{width:100%}.journey-next{width:100%;justify-content:center}.pocket-grid{width:580px}.pocket-composer{padding:16px}}
.pocket-lyric{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#2d2739;border:1px solid #645575;border-radius:9px;padding:13px 15px;margin:16px 0}.pocket-lyric>span{display:grid;grid-template-columns:16px auto;align-items:center;gap:4px 8px;min-width:0;flex:1}.pocket-lyric strong{font-size:10px;letter-spacing:.7px;color:#dec9f4}.pocket-lyric small{grid-column:2;font:italic 13px/1.5 Georgia,serif;color:#c6bccf;overflow-wrap:anywhere}.pocket-lyric button{white-space:nowrap}

/* 0.9 — Arrangement Map: musical scenes without a second DAW timeline. */
.arrangement-map{background:radial-gradient(circle at 100% 0%,#313a4c76,transparent 48%),linear-gradient(130deg,#1a202b,#201d2b);border-color:#556177;margin-bottom:24px}
.arrangement-actions{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin:18px 0}
.arrangement-actions button{min-height:38px}
.arrangement-notice,.arrangement-note{font-size:11px!important;color:#aaaec1!important;line-height:1.6!important}
.arrangement-summary{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-top:1px solid #404758;padding:16px 0;font-size:11px;color:#bcc7d5}
.arrangement-summary strong{color:#e9eef7}.arrangement-summary .arrangement-error{color:#f0ad9f}
.arrangement-sections{display:grid;gap:10px}
.arrangement-scene{background:#222635;border:1px solid #475066;border-radius:13px;padding:14px;position:relative;overflow:hidden}
.arrangement-scene.active{border-color:#66748b;background:#252a3b}
.arrangement-scene-header{display:flex;align-items:center;gap:12px;min-width:0}
.arrangement-scene-number{display:grid;place-items:center;border:1px solid #566177;border-radius:8px;width:34px;height:34px;color:#c9b8ea;font-size:11px;letter-spacing:.7px;font-weight:800;flex-shrink:0}
.arrangement-scene-name{min-width:0;flex:1;display:grid;gap:4px}
.arrangement-scene-name strong{font-size:14px;color:#f4f0f9;overflow-wrap:anywhere}
.arrangement-scene-name small{font-size:10px;color:#a9b5c7}
.arrangement-scene-meter{font-size:10px;color:#d5c5e4;white-space:nowrap}
.arrangement-controls{display:flex;gap:6px;align-items:end;flex-wrap:wrap;margin:15px 0 12px}
.arrangement-controls label{display:grid;gap:5px;color:#b6bed0;font-weight:750;font-size:10px;margin-right:auto;min-width:125px}
.arrangement-controls select{border:1px solid #606a7b;background:#32394b;border-radius:7px;color:#f5f1fa;padding:8px;font-size:11px;min-height:37px}
.arrangement-controls .small-action{min-height:36px;min-width:35px;padding:8px 10px;font-size:10px}
.arrangement-controls .arrangement-active{border-color:#a8b7cf;color:#f3edf8;background:#3b4055}
.arrangement-energy-track{background:#343b4a;height:5px;border-radius:10px;overflow:hidden}
.arrangement-energy-track i{height:100%;display:block;background:linear-gradient(90deg,#bba6dc,#92ccca);border-radius:inherit;transition:width .2s}
.arrangement-footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:17px}
.arrangement-note{margin-top:17px!important}
@media(max-width:700px){.arrangement-scene{padding:12px}.arrangement-controls label{width:100%}.arrangement-controls select{width:100%}.arrangement-footer button{flex:1;justify-content:center}.arrangement-actions button{flex:1}}
.timeline-scenes{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center;margin:10px 0;min-width:0}
.timeline-scenes>span{font-size:9px;color:#acaebe;letter-spacing:.5px;font-weight:800}
.timeline-scenes-track{position:relative;height:29px;background:#272c3b;border:1px solid #4d536a;border-radius:6px;overflow:hidden;min-width:0}
.timeline-scene{position:absolute;top:0;bottom:0;border-right:2px solid #1a1e2a;overflow:hidden;white-space:nowrap;display:flex;align-items:center;padding:0 6px;background:#50476b;color:#f4ecfc;font-size:9px;box-sizing:border-box}
.timeline-scene.level-lift{background:#647e88}.timeline-scene.level-quiet{background:#504966}.timeline-scene.level-break{background:#333649}
.timeline-scene strong{overflow:hidden;text-overflow:ellipsis;font-weight:700}
.arrangement-length-readout{display:flex;align-items:center;min-height:38px;padding:9px 10px;border-radius:8px;border:1px solid #596275;background:#303747;font-size:11px;color:#f2e8f4}
@media(max-width:650px){.timeline-scenes{grid-template-columns:1fr;gap:6px}.timeline-scenes>span{letter-spacing:.9px}}

/* 0.10: harmonic variation and transitions within the existing arrangement grid. */
.arrangement-controls .arrangement-chord-label,.arrangement-controls .arrangement-transition-label{min-width:145px;margin-right:0}
.arrangement-controls .arrangement-transition-label{min-width:122px}
.arrangement-controls .arrangement-chord-label select,.arrangement-controls .arrangement-transition-label select{width:100%}
@media(max-width:700px){.arrangement-controls .arrangement-chord-label,.arrangement-controls .arrangement-transition-label{min-width:0;width:100%}}

/* 0.11: section based vocal comping, reversible and keyboard accessible. */
.vocal-comp{margin-top:20px}
.comp-scene-list{display:grid;gap:8px;margin:18px 0}
.comp-scene{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border:1px solid var(--border,rgba(255,255,255,.11));border-radius:12px;background:rgba(255,255,255,.025)}
.comp-scene span{display:grid;gap:4px;min-width:0}.comp-scene strong{font-size:13px}.comp-scene small{color:var(--muted,#9294a4);font-size:11px}
.comp-scene select{max-width:225px;width:46%;min-height:39px;background:#20242d;color:#ecebf2;border:1px solid #484553;border-radius:9px;padding:8px;cursor:pointer}
.comp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0}.comp-note{font-size:12px;line-height:1.65;color:var(--muted,#9294a4)}
@media(max-width:580px){.comp-scene{align-items:stretch;flex-direction:column}.comp-scene select{max-width:none;width:100%}}

.take-import{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:14px 0 18px}.take-import span{font-size:12px;color:var(--muted,#9294a4);flex:1;min-width:185px;line-height:1.5}

.take-import{display:grid;grid-template-columns:1fr;gap:8px}.take-import label{font-size:12px;color:#e9dafa;font-weight:650}.take-import input[type="file"]{max-width:100%;font:inherit;font-size:12px;color:#bcb6c8;padding:9px;border:1px solid #464454;border-radius:9px;background:#20212b}.take-import input[type="file"]::file-selector-button{border:0;border-radius:6px;padding:8px 10px;margin-right:10px;color:#271c35;background:#d7c5f7;cursor:pointer}.take-import input:focus-visible{outline:2px solid #d7c5f7;outline-offset:2px}

/* 0.12 — Focused punch-in recording without exposing destructive waveform editing. */
.punch-panel{margin-top:21px;background:linear-gradient(138deg,#262232,#22232e 72%);border-color:#65526e}
.punch-panel .card-top h3{font-size:25px;letter-spacing:-.4px}
.punch-scene-list{display:grid;gap:8px;margin:18px 0}
.punch-scene{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0;border:1px solid #54465e;border-radius:12px;padding:13px 14px;background:rgba(255,255,255,.026)}
.punch-scene>div:first-child{display:grid;gap:5px;min-width:0}
.punch-scene strong{font-size:12px;color:#f0e7f5;overflow-wrap:anywhere}
.punch-scene small{color:#b3a2bf;font-size:11px}
.punch-scene-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.punch-scene-actions .small-action{display:inline-flex;align-items:center;gap:7px;min-height:39px}
.punch-action{background:#49324b!important;border-color:#8b638d!important;color:#f5ddec!important}
.punch-action:hover:not(:disabled){background:#654067!important}
.punch-scene-actions button:disabled{opacity:.38;cursor:not-allowed}
.punch-scene-actions button:focus-visible{outline:2px solid #ead0fa;outline-offset:3px}
.punch-active{color:#f3dce6;font-size:12px;line-height:1.5;background:#462b3e;border:1px solid #936480;padding:13px 15px;border-radius:9px;margin-top:14px}
@media(max-width:630px){.punch-scene{flex-direction:column;align-items:stretch}.punch-scene-actions{width:100%}.punch-scene-actions .small-action{flex:1;justify-content:center}}

/* 0.13 · Musician-friendly, non-destructive recording preparation. */
.recording-settings{margin:20px 0 0;border:1px solid #5b526c;background:linear-gradient(125deg,#252333,#1d222b 80%);position:relative;overflow:hidden}
.recording-settings:after{content:"";position:absolute;right:-90px;top:-125px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#ae83ea22,transparent 67%);pointer-events:none}
.recording-settings .card-top,.recording-settings p,.recording-settings-row,.punch-preroll-control{position:relative;z-index:1}
.recording-settings .card-top h3{font-family:Georgia,serif;font-size:26px;letter-spacing:-.3px}
.recording-settings-row{display:flex;flex-wrap:wrap;align-items:center;gap:13px;margin:17px 0 12px}
.recording-settings-row>label:first-child{font-size:12px;color:#e5dcf4;font-weight:650}
.recording-settings-row select{min-height:39px;min-width:112px;color:#ede8f8;background:#252633;border:1px solid #696074;border-radius:10px;padding:8px 13px;cursor:pointer}
.recording-click-label{display:flex;align-items:center;gap:9px;line-height:1.5;font-size:12px;color:#ded3ea;cursor:pointer}
.recording-settings-row .recording-click-label{margin-left:auto}
.recording-click-label input[type="checkbox"]{width:16px;height:16px;accent-color:#c5b1fc;cursor:pointer}
.punch-preroll-control{padding:13px 15px;background:#272633;border:1px solid #484454;border-radius:11px;margin:6px 0 14px}
.recording-settings select:focus-visible,.recording-settings input:focus-visible{outline:2px solid #c6b2ff;outline-offset:3px}
@media(max-width:650px){.recording-settings-row{align-items:flex-start;flex-direction:column}.recording-settings-row .recording-click-label{margin-left:0}}

/* 0.14 · Non-destructive edits; calm, explicit controls that preserve originals. */
.take-editor{margin:17px 0 18px;padding:18px;border:1px solid #70618b;border-radius:16px;background:linear-gradient(125deg,#2e283b,#242633 75%)}
.take-editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.take-editor-head h4{margin:5px 0;font-family:Georgia,serif;font-size:23px;line-height:1.1;letter-spacing:-.3px;color:#f8edf9}
.take-editor-head button{flex-shrink:0}
.take-editor>p{max-width:690px;margin:9px 0 14px;font-size:12px;color:#c4b9d2;line-height:1.7}
.take-edit-wave{position:relative;overflow:hidden;height:70px;border:1px solid #544963;border-radius:10px;background:#1c1e2a}
.take-edit-wave .wave-bars{height:100%;margin:0;position:relative;z-index:1}
.take-edit-mask{position:absolute;z-index:2;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(7,10,17,.8) 0,rgba(7,10,17,.8) 5px,rgba(47,48,65,.82) 5px,rgba(47,48,65,.82) 10px);pointer-events:none}
.take-edit-mask.left{left:0;border-right:2px solid #e8bbab}.take-edit-mask.right{right:0;border-left:2px solid #e8bbab}
.take-edit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0}
.take-edit-grid label{display:flex;flex-wrap:wrap;align-items:center;gap:4px;color:#f2e8f9;font-size:12px;font-weight:650}
.take-edit-grid label span{font-size:10px;color:#b5aabb;font-weight:400}
.take-edit-grid input{width:100%;min-width:0;min-height:40px;padding:9px 11px;background:#1b1f2b;color:#fff;border:1px solid #736780;border-radius:9px;font:inherit;font-size:13px;font-variant-numeric:tabular-nums}
.take-edit-grid input:focus-visible{outline:2px solid #d9c6ff;outline-offset:2px}
.take-editor-foot{font-size:11px;color:#ccb9dd;line-height:1.5}
@media(max-width:690px){.take-edit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.take-editor-head{align-items:flex-start;flex-direction:column}}

.input-peak{font-size:11px;line-height:1.6;margin:5px 0;color:#b6c5d1;font-variant-numeric:tabular-nums}.input-peak.is-clipping{color:#ffacaa;font-weight:700}

.take-cut-handles{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:13px 0 8px}.take-cut-handles label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#cbbfdb}.take-cut-handles input[type=range]{width:100%;accent-color:#ddc6f8;cursor:ew-resize}.take-cut-handles input:focus-visible{outline:2px solid #dbc6ff;outline-offset:3px}@media(max-width:580px){.take-cut-handles{grid-template-columns:1fr;gap:8px}}

/* Optional vocal tone control: deliberately compact and visually distinct. */
.vocal-polish-panel{border:1px solid rgba(177,151,219,.24);background:linear-gradient(135deg,rgba(154,111,217,.085),rgba(49,92,84,.055));border-radius:18px;padding:19px;margin:22px 0 16px}

.vocal-polish-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:13px}
.vocal-polish-actions .small-tag{margin-left:auto}
@media(max-width:650px){.vocal-polish-choice{align-items:stretch;flex-direction:column}.vocal-polish-choice select{max-width:none;width:100%}}

.vocal-review-panel{border-top:1px solid rgba(158,143,184,.2);padding:17px 0 19px;margin-top:6px}
.review-heading{display:flex;justify-content:space-between;gap:14px;align-items:center}

/* 0.26 · Editorial workspace. Creative material has one primary task per view. */

.writing-step.active{background:#302c3a;border-color:#665571}.writing-step.active span{color:#e6bcaa}.writing-step:hover{background:#282531}.writing-steps-line{width:1px;align-self:center;height:25px;background:#45414d}

.lyric-main{border-color:#65556f;background:linear-gradient(160deg,#24202d,#171a24 84%);box-shadow:0 20px 64px #07080b35}.lyric-editor{min-height:425px;font-size:16px;line-height:2.05;letter-spacing:.04px;background:#161922}
.desk-drawer{border:1px solid #414153;border-radius:14px;background:#1a1b25;margin:13px 0;overflow:hidden}.desk-drawer>summary{padding:18px 21px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#efe6f2;font-size:12px;font-weight:750;list-style:none;transition:background .16s}.desk-drawer>summary::-webkit-details-marker{display:none}.desk-drawer>summary:hover{background:#292530}.desk-drawer>summary span{margin-left:auto;font-size:10px;color:#b9a4d0;font-weight:650}.desk-drawer[open]>summary{border-bottom:1px solid #484251;background:#282332}.desk-drawer-content{padding:17px 18px 20px}.desk-drawer-content>.work-card,.desk-drawer-content>.flow-panel{margin:0 0 14px}.desk-drawer-content>.work-card:last-child,.desk-drawer-content>.flow-panel:last-child{margin-bottom:0}

.editorial-aside q{display:block;font:italic 17px/1.5 Georgia,serif;color:#f3e5eb;margin:18px 0 14px;border-left:2px solid #c5adca;padding-left:13px;overflow-wrap:anywhere}.editorial-aside p{line-height:1.7}

/* 0.27: Put the line rehearsal workbench next to the lyrics, not behind menus. */

.line-workbench-heading h3{font:normal 24px/1.25 Georgia,serif;letter-spacing:-.35px;margin:6px 0 0}

/* Desktop-only optional native export, visually secondary to regular WAV. */
.native-export-panel {display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.2rem 0;padding:1rem 1.2rem;border:1px solid var(--border,rgba(210,190,255,.2));border-radius:15px;background:rgba(173,138,221,.055)}

.native-export-buttons{display:flex;align-items:center;gap:.55rem;flex-shrink:0;flex-wrap:wrap}

/* 0.42: Optional, non-destructive mix balance coach on the Finish screen. */
.mix-advice-panel{border-top:1px solid rgba(158,143,184,.2);padding:20px 0 19px;margin-top:2px}

.mix-advice-result{margin-top:15px;border-radius:14px;background:linear-gradient(135deg,rgba(79,146,136,.15),rgba(141,105,178,.08));border:1px solid rgba(121,172,157,.25);padding:15px 16px}
.mix-advice-result>strong{font-size:14px;color:#e5f2e9}

.export-quality-panel{margin:16px 0 20px;border:1px solid rgba(142,173,164,.28);background:linear-gradient(130deg,rgba(53,97,90,.15),rgba(67,59,85,.12));border-radius:16px;padding:17px 18px;color:var(--text,#ecedf2)}

/* 0.44: Non-destructive, accessible mix versions beside the existing balance coach. */

@media(max-width:650px){.mix-version-item,.mix-version-undo{align-items:stretch;flex-direction:column}.mix-version-buttons{flex-wrap:wrap}.mix-version-buttons button{flex:1}}

  <script>
/**
 * A deliberately dependency-free emergency copy of creative writing.
 * This is NEVER a replacement for a full Chordlore (or legacy Wovennote) project archive: audio,
 * timelines, note metadata and arrangement settings are not included.
 */
function exportWritingText(project){
 if(!project || typeof project!=='object')throw new Error('Choose a project to export.');
 const text=value=>typeof value==='string'?value.replace(/\r\n?/g,'\n').replace(/\0/g,''):'';
 const out=['CHORDLORE · WRITING COPY',
  'TEXT ONLY — No recorded audio, instrumentals, takes, cue timings, or studio settings.',
  'This file is not a project backup and cannot restore the music session.',
  '',`Song: ${text(project.title)||'Untitled song'}`,
  `Created from: ${['pour','interview','prompt','import'].includes(project.mode)?project.mode:'unknown'}`,
  '', '=== STORY / FREEFORM NOTES ===',text(project.story),'',
  '=== CREATIVE BRIEF / PROMPT ===',text(project.brief),'',
  '=== GUIDED CONVERSATION ==='];
 for(const entry of Array.isArray(project.exchanges)?project.exchanges:[]){
  out.push(`Question: ${text(entry?.question)}`);
  out.push(`Answer: ${text(entry?.answer)}`,'');

  'END OF WRITING COPY');

}


/**
 * Surgical lyric revisions. Treat a model response as an untrusted suggestion:
 * the only changes allowed for a scoped revision are inside the selected stanza.
 * Original lyrics, headers and other sections remain byte-for-byte untouched.
 */
function songSections(raw) {

  index:i, label:match[1].trim(), header:match[0].trim(),
  start:match.index, bodyStart:match.index+match[0].length,
  end:matches[i+1]?.index??text.length,
  body:text.slice(match.index+match[0].length,matches[i+1]?.index??text.length)

}
function revisionOptions(raw){return [{value:'all',label:'Whole song'},...songSections(raw).map(s=>({value:`section:${s.index}`,label:`Only ${s.label} (${s.index+1})`}))];}

 if(scope==='all')return candidate.trim();
 if(!revisionScopeAllowed(base,scope))throw new Error('That song section no longer exists.');
 const ix=Number(scope.split(':')[1]),sections=songSections(base),target=sections[ix];
 const proposedSections=songSections(candidate);

 if(proposedSections.length){
  // Some models return the entire song; some return one stanza. Either way,
  // choose the corresponding named stanza, never accept changes elsewhere.
  const sameName=sections.slice(0,ix+1).filter(x=>x.label.toLowerCase()===target.label.toLowerCase()).length;
  const matching=proposedSections.filter(x=>x.label.toLowerCase()===target.label.toLowerCase());
  const chosen=matching[sameName-1]||matching[0];
  if(!chosen)throw new Error(`The model did not provide a ${target.label} section. No lyrics changed.`);
  body=chosen.body.trim();
 } else body=candidate.trim();
 if(!body||/^\[[^\]]+\]/m.test(body))throw new Error('The new stanza contains an unexpected section header. No lyrics changed.');
 const eol=base.includes('\r\n')?'\r\n':'\n';
 const next=ix<sections.length-1;
 const suffix=base.slice(target.end);
 const replacement=body.replace(/\r?\n/g,eol);

}

/**
 * Optional acoustic loopback calibration, not a professional round-trip latency
 * guarantee. Records quiet speaker clicks through the selected microphone and
 * estimates their displacement from the AudioContext schedule. Requires audible
 * speakers; cannot work with isolated headphones. Does not monitor the mic.
 */
const LATENCY_MARKERS=[0.56,0.91,1.39,1.89]; // deliberately nonuniform spacing

  let total=0,count=0;
  for(let i=bin*step;i<Math.min(data.length,(bin+1)*step);i++){
   const v=Number(data[i])||0;total+=v*v;count++;

  energy[bin]=Math.sqrt(total/Math.max(1,count));

  const delay=ms/1000;

  const score=sum+min*2;
  if(!best||score>best.score)best={ms,score,levels};

async function measureAcousticLoopback({deviceId='',onState=()=>{}}={}){

  context=new AC();await context.resume();

  const finished=new Promise((resolve,reject)=>{
   recorder.ondataavailable=e=>{if(e.data?.size)parts.push(e.data)};
   recorder.onerror=e=>reject(e.error||new Error('Calibration recorder failed.'));
   recorder.onstop=()=>resolve();
  });

  const start=context.currentTime;recorder.start();
  // Allow the encoder time to initialize before sounding the first click.
  const markers=LATENCY_MARKERS;

   const oscillator=context.createOscillator(),gain=context.createGain(),when=start+relative;

   oscillator.connect(gain).connect(context.destination);
   oscillator.start(when);oscillator.stop(when+.028);
  }

  await finished;

  if(blob.size<200)throw new Error('The calibration recording was empty.');

  const decoded=await context.decodeAudioData(await blob.arrayBuffer());
  return estimateAcousticDelay(decoded.getChannelData(0),decoded.sampleRate,{markers});
 }finally{
  try{if(recorder?.state==='recording')recorder.stop();}catch{}
  stream?.getTracks()?.forEach(track=>track.stop());
  await context?.close?.().catch(()=>{});

}


/**
 * Approximate local recording diagnostics from decoded PCM. Diagnostic only:
 * cannot measure microphone hardware latency, noise provenance, true peaks,
 * codec artifacts or perceived sound quality. Never uploads or edits audio.

const db=(value)=>value>0?20*Math.log10(value):-120;

   throw new Error('This recording cannot be analyzed. Try an audio file shorter than ten minutes.');

 for(let channel=0;channel<channels;channel++){
  const data=buffer.getChannelData(channel);
  if(!data||data.length<samples)throw new Error('The decoded audio channel is incomplete.');
  sources.push(data);

 const windowSize=Math.max(1,Math.round(sampleRate/10/stride));

 for(let i=0;i<samples;i+=stride){
  let framePower=0;
  for(const data of sources){
   const value=Math.max(-1,Math.min(1,finite(data[i])));
   peak=Math.max(peak,Math.abs(value));
   if(Math.abs(value)>=.995)nearClip++;
   framePower+=value*value;

  sum+=avg;observed++;windowSum+=avg;windowCount++;

   if(db(Math.sqrt(windowSum/windowCount))<-48)quietWindows++;
   windows++;windowCount=0;windowSum=0;

 if(peakDb<-18)cautions.push('Recorded level is low. Try moving closer to the microphone or carefully increasing input gain.');

  durationSeconds:samples/sampleRate,peakDb:Math.round(peakDb*10)/10,rmsDb:Math.round(rmsDb*10)/10,
  nearClipPercent:Math.round(nearClipPercent*100)/100,quietPercent:Math.round(quietPercent),

/**
 * Approximate, local-only pre-export mix-balance advisory. No music is changed.
 * The sound in two concurrent sources is sampled in small time windows to
 * compare their relative RMS levels, not perceived loudness (LUFS), true peak,
 * phase, spectral masking, listening experience or mastered output. Suggested
 * values are an editable starting point and must never be applied implicitly.

    !Number.isInteger(channels)||channels<1||channels>8||typeof buffer.getChannelData!=='function')

async function keysPresentInAudioDatabase(references){
  if(!references.length)return new Set();
  const db=await database();
  return new Promise((resolve,reject)=>{
    let transaction;
    try{transaction=db.transaction(OBJECT_STORE,'readonly');}
    catch(error){reject(error);return;}
    const found=new Set();
    const store=transaction.objectStore(OBJECT_STORE);
    // getKey returns the matching key, not its large Blob value.
    // Refuse to silently downgrade to get(), which could fetch user recordings.
    if(typeof store.getKey!=='function'){

    }catch(error){try{transaction.abort();}catch{}reject(error);return;}
    transaction.oncomplete=()=>resolve(found);
    transaction.onerror=()=>reject(transaction.error||new Error('Audio database check failed.'));
    transaction.onabort=()=>reject(transaction.error||new Error('Audio database check was interrupted.'));
  });

    :await keysPresentInAudioDatabase(references);
  return {checked:references.length,missing:references.filter(item=>!found.has(item.key))};

async function deleteAssets(id) {
  const db=await database();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(OBJECT_STORE,'readwrite');
    // Remove every take, legacy recording and backing track associated with this session.
    const request=tx.objectStore(OBJECT_STORE).openCursor();
    request.onsuccess=()=>{
      const cursor=request.result;
      if(!cursor)return;
      if(typeof cursor.key==='string'&&cursor.key.startsWith(`${id}:`))cursor.delete();
      cursor.continue();
    };
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  });
}

async function importProjectFile(file) {
  if(file.size>320*1024*1024) throw new Error('Project files above 320 MB are not supported in this preview.');
  const data=JSON.parse(await file.text());
  const format=validateProjectEnvelope(data);
  if(Object.prototype.hasOwnProperty.call(data,'integrity')){
    validateIntegrityManifest(data.integrity);
    if(await digestSha256(JSON.stringify(data.project))!==data.integrity.project)
      throw new Error('Project backup verification failed: songwriting data was changed or damaged.');
    const bundled={};
    for(const kind of ['backing','vocal'])if(data.assets?.[kind])bundled[kind]=data.assets[kind];
    for(const item of data.assets?.takes||[]){
      if(!item||typeof item.id!=='string'||bundled[`take:${item.id}`])throw new Error('Duplicate recording in backup.');
      bundled[`take:${item.id}`]=item;
    }
    const expected=Object.keys(data.integrity.assets).sort();
    if(JSON.stringify(Object.keys(bundled).sort())!==JSON.stringify(expected))
      throw new Error('Project backup verification failed: missing or unexpected audio assets.');

    for(const [key,item] of Object.entries(bundled)){
      if(!isSupportedAudioDataURL(item.data))throw new Error(`Invalid backup audio: ${key}.`);
      const blob=await (await fetch(item.data)).blob();
      const expectedAsset=data.integrity.assets[key];
      if(blob.size!==expectedAsset.bytes || await digestSha256(blob)!==expectedAsset.sha256)

    }

  const p=prepareImportedProject(data,format);
  const audioData=async (kind,item)=>{
    if(item && !isSupportedAudioDataURL(item.data))throw new Error(`Invalid audio in the backup: ${kind}.`);
    if(isSupportedAudioDataURL(item?.data)) {
      const blob=await (await fetch(item.data)).blob();
      if(blob.size>120*1024*1024)throw new Error('A project audio asset is too large.');
      await saveAsset(`${p.id}:${kind}`,blob);

    for(const kind of ['backing','vocal'])await audioData(kind,data.assets?.[kind]);

}

/**

async function exportNativeInBlocks({config,name,bridge,render=renderMixBuffer,signal,onProgress=()=>{}}){

 const check=()=>{if(signal?.aborted)throw new Error('Native export cancelled.');};
 check();

 signal?.addEventListener('abort',cancel,{once:true});
 const configs=[];
 if(backing||sketch)configs.push([backing,null,backingGain,0,backing?null:sketch,0,null,'off']);

   const audio=await render(...configs[i]);
   check();

   const chunks=pcm24FrameChunks(audio);
   await bridge.startStem(token,sampleRate,frames);

 const p=active();p.updatedAt=Date.now();
 const saved=writeProjects(projects);
 if(!saved && !saveFailed)toast('Your changes are not saved on this device. Check storage permissions and export a project backup.',true);
 saveFailed=!saved;
 writeActive(activeId);
 updateSaveStatus();
 // A failed write must never be presented as an ordinary successful autosave.
 const warning=document.getElementById('save-warning');if(warning)warning.hidden=!(saveFailed||projectStorageProblem()||pendingAudioSave);
 return saved;
}
function toast(message,error=false){clearTimeout(toastTimer);toastTarget.className=error?'show bad':'show';toastTarget.textContent=message;toastTimer=setTimeout(()=>toastTarget.className='',4300);}
function audioHealthMessage(){
 if(audioHealth.state==='missing'){
   const titles=[...new Set(audioHealth.missing.map(x=>x.title))].slice(0,3);
   return `${audioHealth.missing.length} saved recording or instrumental file(s) could not be found (${titles.join(', ')}). Song text is still stored. Do not delete or overwrite these songs; restore from a previous complete backup if available.`;
 }
 if(audioHealth.state==='unavailable')return 'Audio storage could not be verified. Your song text may still be saved, but recording availability is unknown. Keep a full project backup on another drive.';
 return '';
}
function updateSaveStatus(){
 const el=document.getElementById('save-status');
 if(el)el.textContent=saveFailed?'Not saved · check storage':audioHealth.state==='missing'?'Some audio missing':audioHealth.state==='unavailable'?'Audio status unknown':'Saved locally';
 const status=document.querySelector('.saved');
 if(status)status.classList.toggle('save-failed',saveFailed||audioHealth.state==='missing'||audioHealth.state==='unavailable');
 const warning=document.getElementById('audio-health-warning');
 if(warning){warning.hidden=!audioHealthMessage();const message=warning.querySelector('.audio-health-message');if(message)message.textContent=audioHealthMessage();}
}
async function inspectSavedAudio(){
 const generation=++audioHealthGeneration;
 try{
   const report=await auditProjectAudio([...projects]);
   if(generation!==audioHealthGeneration)return;
   audioHealth={state:report.missing.length?'missing':'ok',...report};
 }catch{
   if(generation!==audioHealthGeneration)return;
   audioHealth={state:'unavailable',checked:0,missing:[]};
 }
 updateSaveStatus();
}

async function analyzeMelodyBlob(blob,origin){
 if(!blob?.size||blob.size>60*1024*1024){toast('Choose an audio file under 60 MB.',true);return;}
 const currentId=activeId,previous=normalizeMelody(active().melodyNotes);
 if(previous.length&&!confirm('Replace your current editable melody? You can export its MIDI first.'))return;
 let decoder;melodyAnalyzing=true;render();
 try{
  decoder=new (globalThis.AudioContext||globalThis.webkitAudioContext)();
  const pcm=await decoder.decodeAudioData(await blob.arrayBuffer());
  const reading=analyzeAudioBuffer(pcm,{maxSeconds:30});
  if(!reading.notes.length)throw new Error('No steady solo melody found. Try humming closer to your microphone with less background music.');
  if(activeId!==currentId)return;
  const p=active();p.melodyNotes=normalizeMelody(quantizeMelody(reading.notes,p.bpm));
  p.melodyOrigin=origin+' · first '+Math.round(reading.analyzedSeconds)+'s';
  if(!media.backing&&p.sketchMode==='none')p.sketchMode='use';
  melodySelectedIndex=0;persist();view='arrange';
  toast(`Extracted ${p.melodyNotes.length} editable notes from your voice. Check the pitch by ear.`);
 }catch(error){toast(`Couldn't read melody: ${error.message}`,true);}
 finally{try{await decoder?.close();}catch{}melodyAnalyzing=false;render();}
}

function initTransportTimer(){
 clearInterval(transportTimer);
 transportTimer=setInterval(()=>{
   updatePlayhead();
   if(recording?.state==='recording' && activePunch && punchShouldStop(transportPosition(),activePunch)){
     isSavingTake=true;recording.stop();recording=null;activePunch=null;stopTransport();render();
     toast('Section recording complete. Saving your new take.');return;
   }
   if(recording?.state==='recording' && transportPosition()>=600){
     isSavingTake=true;recording.stop();recording=null;stopTransport();render();
     toast('Ten-minute recording limit reached. Saving this take.');return;
   }
   if(!recording && previewPunch && transportPosition()>=previewPunch.endSeconds){
     stopTransport();render();return;
   }
   if(!recording && transportPlaying && timeline.position()>=timeline.duration()){
     stopTransport();render();
   }
 },85);
}
async function startAccompaniment(includeVocal=true,seek=0,until=0){
 const opts=currentTransportOptions(includeVocal);
 // Singing without an accompaniment is fully supported. A silent audio clock
 // still advances lyric cues and gives a consistent timeline for recording.
 if(!includeVocal && !media.backing && !opts.sketch)opts.silentSeconds=600;
 if(!includeVocal && active().recordingClick)opts.metronome={enabled:true,bpm:active().bpm,meter:active().flowGroove==='sway'?3:4};
 if(until>0)opts.silentSeconds=Math.max(opts.silentSeconds||0,Math.min(600,until+0.25));
 return timeline.play(opts,seek);
}
async function toggleTransport(){
 if(recording || isSavingTake){toast('Finish the current recording before changing playback.');return;}
 if(transportPlaying){timeline.pause();transportPlaying=false;clearInterval(transportTimer);transportTimer=null;render();return;}
 if(!media.backing&&!media.vocal&&active().sketchMode==='none'){toast('Import audio or enable the original sketch to hear a rehearsal.');return;}
 try {
   stopGuide();
   if(!await timeline.play(currentTransportOptions(),timeline.position()))return;
   transportPlaying=true;initTransportTimer();render();
 }catch(e){stopTransport();toast(`Audio playback failed: ${e.message}`,true);}
}
async function hydrateMedia(){
 vocalReview=null;reviewPending=false;mixAdvice=null;mixAdviceSignature=null;
 const loadingId=activeId,isFor=active(),token=++hydrationGeneration;isHydrating=true;
 const current=()=>activeId===loadingId&&token===hydrationGeneration;
 try {
  const selected=(isFor.takes||[]).find(t=>t.id===isFor.selectedTakeId)||(isFor.takes||[]).at(-1);
  const vocalKey=selected?`${loadingId}:take:${selected.id}`:`${loadingId}:vocal`;
  let [backing,vocal]=await Promise.all([loadAsset(`${loadingId}:backing`),loadAsset(vocalKey)]);
  if(!current())return;
  let compActive=false;
  if(isFor.compEnabled&&isFor.arrangementEnabled){
   try{
    const plan=vocalCompPlan(isFor.arrangement,isFor.bpm,isFor.flowGroove==='sway'?3:4,isFor.takes,isFor.compAssignments,isFor.selectedTakeId);
    if(plan.length<1||(isFor.takes||[]).length<2)throw new Error('Two vocal takes and an enabled arrangement are required.');
    const files={};
    await Promise.all(compTakeIds(plan).map(async id=>{files[id]=await loadAsset(`${loadingId}:take:${id}`);}));
    if(!current())return;
    vocal=await renderVocalCompWav(files,plan);
    compActive=true;
   }catch(error){
    if(current()){
     isFor.compEnabled=false;
     persist();toast(`Vocal comp could not be built: ${error.message}. Reverted to the selected original take.`,true);
    }
   }
  }
  if(!current())return;
  stopTransport();
  for(const k of ['backing','vocal'])if(media[`${k}URL`])URL.revokeObjectURL(media[`${k}URL`]);
  media={backing,vocal,backingURL:audioURL(backing),vocalURL:audioURL(vocal),compActive};
  await timeline.prepare(backing,vocal);
  if(!current())return;
  waveform={};
  const peaks=await Promise.allSettled([peaksForBlob(backing),peaksForBlob(vocal)]);
  if(!current())return;
  waveform.backing=peaks[0].status==='fulfilled'?peaks[0].value:[];
  waveform.vocal=peaks[1].status==='fulfilled'?peaks[1].value:[];
  render();
 }catch(e){if(current())toast(`Audio storage issue: ${e.message}`,true);}
 finally{if(token===hydrationGeneration)isHydrating=false;}
}
async function storeAudio(kind,file,projectId=activeId,{punch=null}={}){
 try {
  if(!file || !file.size)return;
  if(file.size>120*1024*1024)throw new Error('Audio files above 120 MB are not supported in this preview.');
  const project=projects.find(p=>p.id===projectId);
  if(!project)throw new Error('The session was removed before the recording could be saved.');
  // Verify imported audio before saving. Never risk losing a captured take solely
  // because this runtime cannot decode its particular MediaRecorder format.
  if(file.name)await inspectAudioBlob(file);
  if(kind==='vocal'){
    const take={id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`,name:punch?`${punch.title} · Take ${(project.takes||[]).length+1}`:file.name?String(file.name).slice(0,55):`Take ${(project.takes||[]).length+1}`,createdAt:Date.now(),size:file.size,type:file.type,startSeconds:punch?.startSeconds||0,offsetMs:0,edit:normalizeTakeEdit(null),punchSectionIndex:punch?.index??null,punchTitle:punch?.title||''};
    const assetKey=`${projectId}:take:${take.id}`;
    await saveAsset(assetKey,file);
    const oldTakes=Array.isArray(project.takes)?[...project.takes]:[];
    const oldSelected=project.selectedTakeId,oldComp=project.compEnabled;
    const oldAssignments={...(project.compAssignments||{})};
    project.takes=[...oldTakes,take];
    if(punch){
      if(!oldSelected)project.selectedTakeId=take.id;
      project.compAssignments={...oldAssignments,[punch.index]:take.id};
    }else project.selectedTakeId=take.id;
    project.compEnabled=false;
    if(!persist()){
      project.takes=oldTakes;project.selectedTakeId=oldSelected;
      project.compEnabled=oldComp;project.compAssignments=oldAssignments;
      await deleteAsset(assetKey).catch(()=>{});
      // Do not discard a newly captured performance just because the metadata
      // index is full. Offer an explicit local download and retry while open.
      pendingAudioSave={file,projectId,punch,name:take.name};
      render();
      throw new Error('Recording not indexed. Download the unsaved recording from the warning banner before closing, or retry saving.');
    }
    if(pendingAudioSave?.file===file)pendingAudioSave=null;
    toast(punch?'Section take saved and assigned in Vocal Comp. Enable combined vocals to hear it with other takes.':'New take saved. Your earlier recordings are safe.');
  } else {
    const assetKey=`${projectId}:backing`;
    const previous=await loadAsset(assetKey);
    const oldName=project.backingName,oldAdded=project.backingAddedAt;
    await saveAsset(assetKey,file);
    project.backingName=file.name||'Imported audio';project.backingAddedAt=Date.now();
    if(!persist()){
      project.backingName=oldName;project.backingAddedAt=oldAdded;
      if(previous)await saveAsset(assetKey,previous).catch(()=>{});
      else await deleteAsset(assetKey).catch(()=>{});
      throw new Error('The instrumental could not be indexed. The prior instrumental was restored where possible.');
    }
    toast('Instrumental added to this session.');
  }
  if(activeId===projectId)await hydrateMedia();
 void inspectSavedAudio();
 } catch(e){
   if(kind==='vocal'&&file?.size&&file.size<=120*1024*1024&&!pendingAudioSave){
     pendingAudioSave={file,projectId,punch,name:file.name||'Unsaved vocal take'};
     render();
   }
   toast(`${e.message||'Could not save audio.'}${pendingAudioSave?' Use the warning banner to download the recording.':''}`,true);
 }
}

async function beginRecording(sectionIndex=null){
 if(pendingAudioSave){toast('Please download or retry your unsaved recording before starting another take.',true);return;}
 if(countdown || recording?.state==='inactive'){cancelCountdown();activePunch=null;stopTransport();render();toast('Recording start cancelled.');return;}
 if(recording?.state==='recording'){
   isSavingTake=true;
   recording.stop();recording=null;activePunch=null;stopTransport();render();return;
 }
 if(isSavingTake){toast('The previous take is still saving.');return;}
 if(micRequestPending){toast('Microphone permission is still being requested.');return;}
 if(!navigator.mediaDevices?.getUserMedia){toast('Microphone not available. Use the desktop app or a secure localhost/HTTPS page.',true);return;}
 let punch=null;
 if(sectionIndex!==null){
   try{const p=active();if(!p.arrangementEnabled)throw new Error('Enable Arrangement Map in Sound before recording a section.');punch=punchSection(p.arrangement,p.bpm,p.flowGroove==='sway'?3:4,sectionIndex);}
   catch(error){toast(error.message,true);return;}
 }
 try {
   micRequestPending=true;stopInputMeter();stopTransport();render();
   const forProject=activeId;
   const recorder=await createRecorder(async blob=>{
     try{await storeAudio('vocal',blob,forProject,{punch});}
     catch(error){toast(error.message,true);}
     finally{isSavingTake=false;recording=null;activePunch=null;render();}
   },selectedMic,error=>{
     stopTransport();recording=null;activePunch=null;countdown=0;isSavingTake=false;render();
     toast(`Recording stopped: ${error.message}`,true);
   });
   micRequestPending=false;await readMicDevices();
   const attempt=++recordingAttempt;
   recording=recorder;activePunch=punch;
   const p=active(),plan=countInPlan(p.bpm,p.flowGroove==='sway'?3:4,normalizeCountInBars(p.countInBars));
   countdown=plan.totalBeats;render();
   try{
     currentCountIn=await startCountIn(p.bpm,plan.meter,plan.bars,(event,details)=>{
       if(attempt!==recordingAttempt||recording!==recorder)return;
       countdown=details.totalBeats-event.index;
       const hint=document.getElementById('booth-hint');
       if(hint)hint.textContent=`Beat ${event.beat} of ${details.meter} · ${details.bars-event.bar} bar${details.bars-event.bar===1?'':'s'} left`;
     });
     if(attempt!==recordingAttempt||recording!==recorder){currentCountIn.cancel();return;}
     const completed=await currentCountIn.finished;
     currentCountIn=null;
     if(attempt!==recordingAttempt||recording!==recorder)return;
     if(!completed)throw new Error('The audio clock stopped during the count-in. Check your audio output and retry.');
     countdown=0;
     const lead=punch?punchLeadIn(punch,p.bpm,plan.meter,p.punchPreRoll!==false):null;
     if(!await startAccompaniment(false,lead?.seekSeconds??0,punch?.endSeconds||0))throw new Error('Playback was interrupted before recording could start.');
     if(attempt!==recordingAttempt||recording!==recorder){stopTransport();return;}
     if(lead?.leadSeconds>0.002){
       const hint=document.getElementById('booth-hint');if(hint)hint.textContent=`Hear the lead-in · recording begins at ${formatTime(punch.startSeconds)}`;
       const entered=await waitForPunchEntrance(()=>timeline.positionUnbounded(),lead.recordAtSeconds,()=>attempt!==recordingAttempt||recording!==recorder);
       if(!entered){stopTransport();return;}
     }
     if(attempt!==recordingAttempt||recording!==recorder){stopTransport();return;}
     startedAt=performance.now();
     recorder.start(250);transportPlaying=true;render();initTransportTimer();
   }catch(error){
     currentCountIn?.cancel();currentCountIn=null;
     recorder.stream.getTracks().forEach(t=>t.stop());
     if(recording===recorder){recording=null;activePunch=null;countdown=0;stopTransport();render();}
     toast(`Couldn't begin recording: ${error.message}`,true);
   }
 }catch(e){micRequestPending=false;toast(`Could not start microphone: ${e.message}`,true);recording=null;activePunch=null;countdown=0;render();}
}
function tapTempo(){const now=performance.now();tapHistory=tapHistory.filter(x=>now-x<2600);tapHistory.push(now);if(tapHistory.length>=3){const intervals=tapHistory.slice(1).map((x,i)=>x-tapHistory[i]);const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;const bpm=Math.round(60000/avg);if(bpm>=50&&bpm<=160){field('bpm',bpm);const el=document.getElementById('bpm-value');if(el)el.textContent=bpm;const sl=document.getElementById('bpm-slider');if(sl)sl.value=bpm;}}}
